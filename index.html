<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GameCenterEG ゲームセンターＥＧ</title>
<meta name="description" content="毎日ひとつ、AIと作ったミニゲームが増えていくゲームセンター">
<script>
  // 前の置き場所(GitHub Pages)から来た人は新しい場所へ
  if (location.hostname.endsWith('github.io')) location.replace('https://gamecenter.egoapps.com/');
</script>
<style>
  :root {
    --bg: #12121c; --panel: #1d1d2e; --panel2: #26263b; --ink: #f1f0fa; --muted: #9a98b5;
    --accent: #8b7bff; --accent2: #ff6a8a; --gold: #ffd25e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
    padding: 20px 16px 60px;
  }
  a { color: inherit; }
  .wrap { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 20px; }
  .logo { font-size: 30px; font-weight: 900; letter-spacing: .02em; margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .logo-ja { font-size: 13px; color: var(--muted); letter-spacing: .3em; margin-top: 2px; }
  .sub { color: var(--muted); font-size: 13px; margin: 10px 0 0; }

  h2 { font-size: 15px; margin: 28px 0 10px; color: var(--muted); letter-spacing: .08em; }

  .today { background: linear-gradient(145deg, #3b2f8f, #5a2f7a); border-radius: 18px; padding: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.35); }
  .today .label { font-size: 12px; color: #d8d2ff; letter-spacing: .1em; }
  .today .title { font-size: 22px; font-weight: 800; margin: 6px 0 4px; line-height: 1.35; }
  .today .meta { font-size: 13px; color: #d8d2ff; }
  .today .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .btn { display: inline-block; text-decoration: none; font-weight: 800; border-radius: 999px; padding: 10px 22px; font-size: 15px; }
  .btn.play { background: var(--gold); color: #2a2100; }
  .btn.rank { background: rgba(255,255,255,.14); color: #fff; }
  .none { color: var(--muted); font-size: 14px; }

  #monthNav { display: flex; justify-content: center; gap: 12px; align-items: center; margin-bottom: 10px; }
  #monthNav button { background: var(--panel2); color: var(--ink); border: none; border-radius: 8px; padding: 6px 12px; cursor: pointer; font: inherit; font-size: 13px; }
  #monthNav button:disabled { opacity: .3; cursor: default; }
  #monthLabel { font-size: 15px; font-weight: 700; min-width: 110px; text-align: center; }
  #cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 5px; }
  .dow { text-align: center; font-size: 11px; color: var(--muted); padding-bottom: 2px; }
  .day { aspect-ratio: 1; border-radius: 8px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-size: 13px; color: #555470; text-decoration: none; }
  .day.empty { background: transparent; }
  .day.has-game { background: linear-gradient(145deg, #5a4ab0, #3a2f80); color: #fff; }
  .day.has-game:hover { filter: brightness(1.2); }
  .day.today { outline: 2px solid var(--gold); outline-offset: -2px; }
  .day .num { font-weight: 700; }
  .day .dot { font-size: 14px; line-height: 1; margin-top: 2px; }

  .list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .item { background: var(--panel); border-radius: 12px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
  .item .t { font-weight: 700; line-height: 1.4; text-decoration: none; }
  .item .t:hover { text-decoration: underline; }
  .item .stats { font-size: 12px; color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
  .item .stats a { color: var(--gold); text-decoration: none; }
  .item .go { grid-row: 1 / span 2; grid-column: 2; background: var(--accent); color: #fff; text-decoration: none; font-weight: 800; font-size: 13px; border-radius: 999px; padding: 8px 14px; white-space: nowrap; }
  footer { text-align: center; color: var(--muted); font-size: 11px; margin-top: 36px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="logo">GameCenterEG</h1>
    <div class="logo-ja">ゲームセンターＥＧ</div>
    <p class="sub">毎日ひとつ、AIと作ったミニゲームが増えていくよ</p>
  </header>

  <section id="todayBox"></section>

  <h2>カレンダー</h2>
  <div id="monthNav">
    <button id="prev">← 前の月</button>
    <div id="monthLabel"></div>
    <button id="next">次の月 →</button>
  </div>
  <div id="cal"></div>

  <h2>これまでのゲーム</h2>
  <ul class="list" id="list"></ul>

  <footer>GameCenterEG · ゲームセンターＥＧ</footer>
</div>

<script>
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const mdw = ds => { const d = new Date(ds + 'T00:00:00'); return `${d.getMonth() + 1}/${d.getDate()}(${'日月火水木金土'[d.getDay()]})`; };
const fmtScore = (v, sc) => {
  const dec = sc?.decimals ?? (Number.isInteger(v) ? 0 : 2);
  return Number(v).toLocaleString('ja-JP', { minimumFractionDigits: dec, maximumFractionDigits: dec }) + (sc?.unit ?? '点');
};
const rankLink = g => g.score ? `<a href="ranking.html?game=${encodeURIComponent(g.slug)}">🏆 ${g.top ? esc(g.top.name) + ' ' + fmtScore(g.top.score, g.score) : 'ランキング'}</a>` : '';

let games = [], today = '', viewY, viewM, minYM, maxYM;

async function load() {
  const res = await fetch('/api/games');
  const data = await res.json();
  games = data.games; today = data.today;
  const [y, m] = today.split('-').map(Number);
  viewY = y; viewM = m - 1;
  const first = games.map(g => g.date).sort()[0] || today;
  minYM = first.slice(0, 7); maxYM = today.slice(0, 7);
  renderToday(); renderCal(); renderList();
}

function renderToday() {
  const g = games.find(x => x.date === today);
  const box = document.getElementById('todayBox');
  if (!g) { box.innerHTML = `<div class="today"><div class="label">今日のゲーム</div><p class="none">今日の分はまだ準備中。これまでのゲームで遊んでね</p></div>`; return; }
  box.innerHTML = `<div class="today">
    <div class="label">今日のゲーム · ${mdw(g.date)}</div>
    <div class="title">${esc(g.title)}</div>
    <div class="meta">👀 ${g.plays.toLocaleString()}回あそばれた${g.top ? ` · 🏆 ${esc(g.top.name)} ${fmtScore(g.top.score, g.score)}` : ''}</div>
    <div class="actions"><a class="btn play" href="${esc(g.href)}">▶ あそぶ</a>${g.score ? `<a class="btn rank" href="ranking.html?game=${encodeURIComponent(g.slug)}">🏆 ランキング</a>` : ''}</div>
  </div>`;
}

function renderCal() {
  const ym = `${viewY}-${pad(viewM + 1)}`;
  document.getElementById('monthLabel').textContent = `${viewY}年 ${viewM + 1}月`;
  document.getElementById('prev').disabled = ym <= minYM;
  document.getElementById('next').disabled = ym >= maxYM;
  const cal = document.getElementById('cal');
  cal.innerHTML = '日月火水木金土'.split('').map(d => `<div class="dow">${d}</div>`).join('');
  const firstDow = new Date(viewY, viewM, 1).getDay();
  const days = new Date(viewY, viewM + 1, 0).getDate();
  let html = '<div class="day empty"></div>'.repeat(firstDow);
  for (let d = 1; d <= days; d++) {
    const ds = `${ym}-${pad(d)}`, g = games.find(x => x.date === ds);
    const cls = 'day' + (g ? ' has-game' : '') + (ds === today ? ' today' : '');
    html += g
      ? `<a class="${cls}" href="${esc(g.href)}" title="${esc(g.title)}"><span class="num">${d}</span><span class="dot">🎮</span></a>`
      : `<div class="${cls}"><span class="num">${d}</span></div>`;
  }
  cal.insertAdjacentHTML('beforeend', html);
}
function shiftMonth(n) {
  viewM += n;
  if (viewM < 0) { viewM = 11; viewY--; }
  if (viewM > 11) { viewM = 0; viewY++; }
  renderCal();
}
document.getElementById('prev').onclick = () => shiftMonth(-1);
document.getElementById('next').onclick = () => shiftMonth(1);

function renderList() {
  document.getElementById('list').innerHTML = games.slice().sort((a, b) => b.date.localeCompare(a.date)).map(g => `
    <li class="item">
      <a class="t" href="${esc(g.href)}">${esc(g.title)}</a>
      <a class="go" href="${esc(g.href)}">▶ あそぶ</a>
      <div class="stats"><span>${mdw(g.date)}</span><span>👀 ${g.plays.toLocaleString()}回</span>${rankLink(g)}</div>
    </li>`).join('');
}

load().catch(() => { document.getElementById('todayBox').innerHTML = '<p class="none">読み込めなかった。少し待ってから開き直してね</p>'; });
</script>
</body>
</html>
