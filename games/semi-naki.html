<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>セミ時雨でストレスを</title>
<style>
  body { margin:0; background:#1a3a1a; color:#eaf5e0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:800px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; }
  canvas { background:#2a5a2a; border:3px solid #1a3a1a; border-radius:10px; display:block; }
  #ctl { display:flex; justify-content:center; gap:14px; margin-top:12px; width:800px; max-width:100%; }
  #ctl button { font-size:15px; padding:10px 18px; border-radius:10px; border:none; background:#f0c020; color:#3a2a0a; cursor:pointer; font-weight:bold; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:26px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#3a2a0a; cursor:pointer; font-weight:bold; }
  #help { max-width:800px; font-size:13px; color:#c0d8b0; margin-top:10px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🦗 セミ時雨でストレスを</h1>
  <div id="hud">
    <div>ストレス度: <span id="score">0</span></div>
    <div id="warn"></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="800" height="340"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="ctl">
    <button onclick="cry()">📢 鳴く</button>
    <button onclick="moveTree(-1)">⬅️ 隣の木へ</button>
    <button onclick="flipSide()">🔄 裏に隠れる</button>
    <button onclick="moveTree(1)">➡️ 隣の木へ</button>
  </div>
  <div id="help">
    「鳴く」を押すほどストレス度(スコア)が上がるが、今いる木の警戒度も上がっていく。<br>
    警戒度が満タンになると人が見に来る。その瞬間に<b>表(見える側)にいると即アウト</b>。裏に隠れるか、別の木へ移動して切り抜けよう。
  </div>

<script>
const TREE_COUNT = 5;
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    treeIndex: 2, side: 'front', score: 0,
    detection: Array(TREE_COUNT).fill(0),
    running: true, flash: null, flashTimer: 0,
  };
  render();
}

function cry() {
  if (!state.running) return;
  state.score += 5;
  state.detection[state.treeIndex] = Math.min(100, state.detection[state.treeIndex] + 11);
  document.getElementById('score').textContent = state.score;
  state.flash = 'ミーンミーン！'; state.flashTimer = 30;
}

function moveTree(dir) {
  if (!state.running) return;
  state.treeIndex = Math.max(0, Math.min(TREE_COUNT - 1, state.treeIndex + dir));
}

function flipSide() {
  if (!state.running) return;
  state.side = state.side === 'front' ? 'back' : 'front';
}

document.addEventListener('keydown', e => {
  if (e.code === 'Space') { e.preventDefault(); cry(); }
  if (e.key === 'ArrowLeft' || e.key === 'a') moveTree(-1);
  if (e.key === 'ArrowRight' || e.key === 'd') moveTree(1);
  if (e.key === 'ArrowDown' || e.key === 's') flipSide();
});

function update() {
  if (!state.running) return;
  for (let i = 0; i < TREE_COUNT; i++) {
    state.detection[i] = Math.max(0, state.detection[i] - 0.25);
  }
  // 木ごとに警戒度が満タンなら人が来てチェックする
  for (let i = 0; i < TREE_COUNT; i++) {
    if (state.detection[i] >= 100) {
      const caught = (i === state.treeIndex && state.side === 'front');
      if (caught) { return endGame(); }
      state.detection[i] = 0;
      if (i === state.treeIndex) { state.flash = 'ヒヤッ…裏で助かった！'; state.flashTimer = 40; }
    }
  }
  if (state.flashTimer > 0) state.flashTimer--; else state.flash = null;
  render();
}

function endGame(title) {
  state.running = false;
  document.getElementById('msgTitle').textContent = title || '🧤 捕まった！';
  document.getElementById('msgText').textContent = `与えたストレス度: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const spacing = W / TREE_COUNT;
  for (let i = 0; i < TREE_COUNT; i++) {
    const x = spacing * i + spacing / 2;
    ctx.fillStyle = '#5a3a1a';
    ctx.fillRect(x - 10, 120, 20, 180);
    ctx.beginPath();
    ctx.arc(x, 100, 55, 0, Math.PI * 2);
    ctx.fillStyle = '#3a7a3a';
    ctx.fill();

    // 警戒度バー
    const d = state.detection[i];
    ctx.fillStyle = '#222';
    ctx.fillRect(x - 30, 310, 60, 10);
    ctx.fillStyle = d > 70 ? '#e74c3c' : d > 40 ? '#e0a33a' : '#6cc070';
    ctx.fillRect(x - 30, 310, 60 * (d / 100), 10);

    if (i === state.treeIndex) {
      ctx.font = '34px sans-serif';
      ctx.fillText(state.side === 'front' ? '🦗' : '🙈', x - 17, 170);
    }
  }

  if (state.flash) {
    ctx.font = 'bold 18px sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(state.flash, W / 2, 40);
    ctx.textAlign = 'left';
  }

  document.getElementById('warn').textContent = state.side === 'front' ? '👁️ 表(見える側)' : '🙈 裏(隠れてる)';
}

setInterval(update, 1000/30);
resetGame();
window.gcGiveUp = () => { if (state.running) endGame('🏳️ ここで終了'); };
</script>
</body>
</html>
