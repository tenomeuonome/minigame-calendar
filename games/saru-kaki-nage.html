<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>さるかに合戦 サルの柿投げ</title>
<style>
  body { margin:0; background:#1a3a4a; color:#eef8f0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:600px; max-width:100%; margin-bottom:8px; font-size:14px; gap:10px; flex-wrap:wrap; align-items:center; }
  #fullWrap { width:120px; height:12px; background:#2a4a2a; border-radius:6px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px; }
  #fullBar { height:100%; width:100%; background:#f0c020; }
  #wrap { position:relative; }
  canvas { background:#9adcf0; border:3px solid #2a5a3a; border-radius:10px; display:block; touch-action:none; }
  #ctl { display:grid; grid-template-columns:repeat(3,70px); grid-template-rows:repeat(2,50px); gap:8px; margin-top:12px; justify-content:center; }
  #ctl button { font-size:18px; border-radius:10px; border:none; background:#5a8a3a; color:#fff; cursor:pointer; user-select:none; }
  #ctl button:active { background:#7aaa5a; }
  #btnLeft { grid-column:1; grid-row:1/3; }
  #btnRight { grid-column:3; grid-row:1/3; }
  #btnThrow { grid-column:2; grid-row:1; background:#d87a2a; font-size:14px; }
  #btnEat { grid-column:2; grid-row:2; background:#3a8a5a; font-size:14px; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:600px; font-size:13px; color:#cfe8d8; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🐵 さるかに合戦 サルの柿投げ</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>満腹: <span id="fullWrap"><span id="fullBar"></span></span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="600" height="440"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="ctl">
    <button id="btnLeft">◀</button>
    <button id="btnThrow">🥭 投げる</button>
    <button id="btnRight">▶</button>
    <button id="btnEat">🍽️ 食べる</button>
  </div>
  <div id="help">
    左右(矢印キー←→)でサルを枝の間で動かし、スペースキーか「投げる」で真下に青い柿を落とす。
    カニ🦀・ハチ🐝は1発、臼⚱️は硬くて3発で撃退。どれか1体でもサルの高さまで登ってきたらゲームオーバー。<br>
    木になってる柿は時間とともに青🟢→熟🟠へ実っていく。下矢印キーか「食べる」で今の実を食べられるが、
    <b>熟す前に食べるとお腹を壊して満腹ゲージが減る</b>。満腹ゲージが尽きてもゲームオーバー。
  </div>

<script>
const W = 600, H = 440, LANES = 5, LANE_W = W / LANES;
const MONKEY_Y = 60, GROUND_Y = 400, TOP_LIMIT = 95;
const RIPEN_PER_FRAME = 100 / (7 * 30);   // 青い柿が熟すまで約7秒
const HUNGER_DRAIN = 100 / (90 * 30);     // 満腹ゲージは何もしないと約90秒でゼロ
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    lane: 2, score: 0, running: true, throwCooldown: 0, eatCooldown: 0,
    fullness: 100, ripeness: 0,
    enemies: [], persimmons: [], spawnTimer: 60, flash: null, flashTimer: 0,
  };
  updateHud();
  render();
}

function updateHud() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('fullBar').style.width = Math.max(0, state.fullness) + '%';
  document.getElementById('fullBar').style.background = state.fullness < 30 ? '#e04a3a' : '#f0c020';
}

function laneX(lane) { return lane * LANE_W + LANE_W / 2; }

function moveLane(d) {
  if (!state.running) return;
  state.lane = Math.max(0, Math.min(LANES - 1, state.lane + d));
}
function throwPersimmon() {
  if (!state.running || state.throwCooldown > 0) return;
  state.throwCooldown = 14;
  state.persimmons.push({ lane: state.lane, y: MONKEY_Y + 20 });
  state.ripeness = 0;
}

function eatPersimmon() {
  if (!state.running || state.eatCooldown > 0) return;
  state.eatCooldown = 14;
  if (state.ripeness >= 100) {
    state.fullness = Math.min(100, state.fullness + 30);
    state.flash = '🟠 おいしい！+30'; state.flashTimer = 24;
  } else {
    state.fullness = Math.max(0, state.fullness - 20);
    state.flash = '🤢 まだ青い…-20'; state.flashTimer = 24;
  }
  state.ripeness = 0;
  updateHud();
}

document.getElementById('btnLeft').onclick = () => moveLane(-1);
document.getElementById('btnRight').onclick = () => moveLane(1);
document.getElementById('btnThrow').onclick = throwPersimmon;
document.getElementById('btnEat').onclick = eatPersimmon;
document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowDown',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowLeft') moveLane(-1);
  if (e.key === 'ArrowRight') moveLane(1);
  if (e.key === ' ') throwPersimmon();
  if (e.key === 'ArrowDown') eatPersimmon();
});

const ENEMY_TYPES = {
  kani: { icon: '🦀', hp: 1, speed: 1.6, score: 10 },
  hachi: { icon: '🐝', hp: 1, speed: 2.3, score: 15 },
  usu: { icon: '⚱️', hp: 3, speed: 0.9, score: 30 },
};

function spawnEnemy() {
  const roll = Math.random();
  const difficulty = Math.min(1, state.score / 600);
  let type;
  if (roll < 0.1 + difficulty * 0.1) type = 'usu';
  else if (roll < 0.5) type = 'hachi';
  else type = 'kani';
  const base = ENEMY_TYPES[type];
  state.enemies.push({
    type, lane: Math.floor(Math.random() * LANES), y: GROUND_Y,
    hp: base.hp, speed: base.speed * (1 + difficulty * 0.6),
  });
}

function update() {
  if (!state.running) return;
  if (state.throwCooldown > 0) state.throwCooldown--;
  if (state.eatCooldown > 0) state.eatCooldown--;
  if (state.flashTimer > 0) state.flashTimer--; else state.flash = null;

  state.ripeness = Math.min(100, state.ripeness + RIPEN_PER_FRAME);
  state.fullness = Math.max(0, state.fullness - HUNGER_DRAIN);
  updateHud();
  if (state.fullness <= 0) return endGame('hunger');

  state.spawnTimer--;
  if (state.spawnTimer <= 0) {
    spawnEnemy();
    const difficulty = Math.min(1, state.score / 600);
    state.spawnTimer = Math.max(22, 65 - difficulty * 35) + Math.random() * 25;
  }

  state.persimmons.forEach(p => { p.y -= 7; });
  state.persimmons = state.persimmons.filter(p => p.y > MONKEY_Y);

  state.enemies.forEach(en => { en.y -= en.speed; });

  for (let i = state.persimmons.length - 1; i >= 0; i--) {
    const p = state.persimmons[i];
    for (let j = state.enemies.length - 1; j >= 0; j--) {
      const en = state.enemies[j];
      if (en.lane === p.lane && Math.abs(en.y - p.y) < 22) {
        en.hp--;
        state.persimmons.splice(i, 1);
        if (en.hp <= 0) {
          state.score += ENEMY_TYPES[en.type].score;
          state.enemies.splice(j, 1);
          updateHud();
          state.flash = `${ENEMY_TYPES[en.type].icon} 撃退！`; state.flashTimer = 20;
        }
        break;
      }
    }
  }

  if (state.enemies.some(en => en.y <= TOP_LIMIT)) return endGame('caught');
  state.enemies = state.enemies.filter(en => en.y > 0);

  render();
}

function endGame(reason) {
  state.running = false;
  document.getElementById('msgTitle').textContent =
    reason === 'hunger' ? '🍌 お腹が空きすぎて動けなくなった…' : '🙈 サル、やられた！';
  document.getElementById('msgText').textContent = `スコア: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#6a9a3a'; ctx.fillRect(0, GROUND_Y + 10, W, H - GROUND_Y - 10);

  ctx.strokeStyle = 'rgba(90,60,20,0.5)'; ctx.lineWidth = 3;
  for (let i = 0; i < LANES; i++) {
    const x = laneX(i);
    ctx.beginPath(); ctx.moveTo(x, MONKEY_Y + 30); ctx.lineTo(x, GROUND_Y + 10); ctx.stroke();
  }

  ctx.font = '34px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🙈', laneX(state.lane), MONKEY_Y + 10);
  ctx.font = '20px sans-serif';
  ctx.fillText(state.ripeness >= 100 ? '🌳🟠' : '🌳🟢', laneX(state.lane), MONKEY_Y - 16);
  ctx.fillStyle = '#222'; ctx.fillRect(laneX(state.lane) - 18, MONKEY_Y - 30, 36, 4);
  ctx.fillStyle = state.ripeness >= 100 ? '#e08a2a' : '#5a9a3a';
  ctx.fillRect(laneX(state.lane) - 18, MONKEY_Y - 30, 36 * (state.ripeness / 100), 4);

  ctx.font = '26px sans-serif';
  state.persimmons.forEach(p => ctx.fillText('🟢', laneX(p.lane), p.y));

  state.enemies.forEach(en => {
    const base = ENEMY_TYPES[en.type];
    ctx.font = en.type === 'usu' ? '32px sans-serif' : '28px sans-serif';
    ctx.fillText(base.icon, laneX(en.lane), en.y);
    if (base.hp > 1) {
      ctx.fillStyle = '#222'; ctx.fillRect(laneX(en.lane) - 16, en.y + 8, 32, 5);
      ctx.fillStyle = '#e04a3a'; ctx.fillRect(laneX(en.lane) - 16, en.y + 8, 32 * (en.hp / base.hp), 5);
    }
  });

  ctx.strokeStyle = 'rgba(255,60,60,0.5)'; ctx.setLineDash([6, 6]);
  ctx.beginPath(); ctx.moveTo(0, TOP_LIMIT + 14); ctx.lineTo(W, TOP_LIMIT + 14); ctx.stroke();
  ctx.setLineDash([]);

  if (state.flash) {
    ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#fff';
    ctx.fillText(state.flash, W / 2, 30);
  }
  ctx.textAlign = 'left';
}

setInterval(update, 1000 / 30);
resetGame();
</script>
</body>
</html>
