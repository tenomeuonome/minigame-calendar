<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牛丼屋さん</title>
<style>
  body {
    margin: 0;
    background: #fff4e6;
    color: #4a2e1a;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 8px 0; }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 800px;
    max-width: 100%;
    margin-bottom: 8px;
    font-size: 14px;
  }
  #wrap { position: relative; width: 800px; max-width: 100%; }
  #board {
    display: flex;
    gap: 16px;
    background: #fff;
    border: 3px solid #d9a35a;
    border-radius: 14px;
    padding: 20px;
  }
  #orderPanel { flex: 1; }
  #orderPanel h2 { font-size: 15px; margin: 0 0 10px; }
  .orderSpec { font-size: 15px; line-height: 2; }
  .orderSpec b { color: #c0392b; }
  .patience-bar { height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin-top: 10px; }
  .patience-fill { height: 100%; background: #6cc070; transition: width 0.1s linear; }
  .patience-fill.warn { background: #e0a33a; }
  .patience-fill.danger { background: #d9534f; }

  #bowlPanel { flex: 1; text-align: center; }
  #bowl {
    font-size: 54px;
    height: 90px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #fdf0d8;
    border-radius: 50% 50% 10px 10px / 30% 30% 10px 10px;
    border: 3px solid #c98a3f;
    margin: 0 auto 14px;
    width: 160px;
  }
  .ctl { margin-bottom: 10px; }
  .ctl button {
    font-size: 14px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 2px solid #d9a35a;
    background: #fffaf0;
    cursor: pointer;
    min-width: 150px;
  }
  #serveBtn {
    margin-top: 6px;
    font-size: 16px;
    padding: 10px 24px;
    border-radius: 10px;
    border: none;
    background: #c0392b;
    color: #fff;
    cursor: pointer;
    font-weight: bold;
  }
  #msg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.7); border-radius: 14px; text-align: center; color: #fff;
  }
  #msg h2 { font-size: 26px; margin-bottom: 8px; }
  #msg button { padding: 8px 20px; font-size: 15px; border-radius: 6px; border: none; background: #e08a3a; color: #fff; cursor: pointer; margin-top: 8px; }
  #toast {
    text-align: center; font-size: 14px; font-weight: bold; height: 20px; margin-top: 10px;
  }
  #help { max-width: 800px; font-size: 13px; color: #8a6a4a; margin-top: 14px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
  <h1>🐮 牛丼屋さん</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>残り時間: <span id="time">60</span>秒</div>
    <div>ミス: <span id="miss">0</span> / 5</div>
  </div>
  <div id="wrap">
    <div id="board">
      <div id="orderPanel">
        <h2>📋 注文</h2>
        <div class="orderSpec" id="orderSpec"></div>
        <div class="patience-bar"><div class="patience-fill" id="patienceFill" style="width:100%"></div></div>
      </div>
      <div id="bowlPanel">
        <div id="bowl"></div>
        <div class="ctl"><button onclick="cycleSize()">量: <span id="curSize">普通</span></button></div>
        <div class="ctl"><button onclick="cycleSauce()">つゆ: <span id="curSauce">普通</span></button></div>
        <div class="ctl"><button onclick="toggleNegi()">ねぎ: <span id="curNegi">あり</span></button></div>
        <button id="serveBtn" onclick="serve()">🍚 提供する</button>
      </div>
    </div>
    <div id="toast"></div>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    注文票どおりに「量」「つゆ」「ねぎ」を設定してから提供する。合っていれば大盛況、違っているとミス。<br>
    ゲージが切れる前に提供しよう。ミス5回でゲームオーバー。
  </div>

<script>
const SIZES = ['普通', '大盛り'];
const SAUCES = ['少なめ', '普通', 'だく'];

let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    bowl: { size: '普通', sauce: '普通', negi: true },
    order: null,
    patience: 1,
    score: 0,
    miss: 0,
    timeLeft: 60,
    running: true,
  };
  nextOrder();
  render();
}

function randomOrder() {
  return {
    size: SIZES[Math.floor(Math.random() * SIZES.length)],
    sauce: SAUCES[Math.floor(Math.random() * SAUCES.length)],
    negi: Math.random() < 0.7, // ねぎぬきは少数派
  };
}

function nextOrder() {
  state.order = randomOrder();
  state.bowl = { size: '普通', sauce: '普通', negi: true };
  state.patience = 1;
}

function cycleSize() {
  const i = SIZES.indexOf(state.bowl.size);
  state.bowl.size = SIZES[(i + 1) % SIZES.length];
  render();
}
function cycleSauce() {
  const i = SAUCES.indexOf(state.bowl.sauce);
  state.bowl.sauce = SAUCES[(i + 1) % SAUCES.length];
  render();
}
function toggleNegi() {
  state.bowl.negi = !state.bowl.negi;
  render();
}

function toast(text, ok) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.style.color = ok ? '#2e7d32' : '#c0392b';
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 900);
}

function serve() {
  if (!state.running) return;
  const o = state.order, b = state.bowl;
  const ok = o.size === b.size && o.sauce === b.sauce && o.negi === b.negi;
  if (ok) {
    const bonus = Math.ceil(state.patience * 10);
    state.score += 10 + bonus;
    toast('大盛況！ +' + (10 + bonus), true);
  } else {
    state.miss++;
    toast('注文と違う…', false);
    if (state.miss >= 5) return endGame(false);
  }
  nextOrder();
  render();
}

function update() {
  if (!state.running) return;
  state.patience -= 1 / (420 + state.score * 2); // だんだん少し忙しくなる
  if (state.patience <= 0) {
    state.miss++;
    toast('お客さん帰っちゃった…', false);
    if (state.miss >= 5) return endGame(false);
    nextOrder();
  }

  state.timeLeft -= 1/60;
  if (state.timeLeft <= 0) return endGame(true);
  render();
}

function sizeLabel(s) { return s; }

function render() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('miss').textContent = state.miss;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));

  const o = state.order;
  document.getElementById('orderSpec').innerHTML =
    `量: <b>${o.size}</b><br>つゆ: <b>${o.sauce}</b><br>ねぎ: <b>${o.negi ? 'あり' : 'ぬき'}</b>`;

  const pct = Math.max(0, state.patience * 100);
  const fill = document.getElementById('patienceFill');
  fill.style.width = pct + '%';
  fill.className = 'patience-fill' + (pct < 25 ? ' danger' : pct < 55 ? ' warn' : '');

  const b = state.bowl;
  document.getElementById('curSize').textContent = b.size;
  document.getElementById('curSauce').textContent = b.sauce;
  document.getElementById('curNegi').textContent = b.negi ? 'あり' : 'ぬき';

  let bowlEmoji = b.size === '大盛り' ? '🍚🍚' : '🍚';
  bowlEmoji += '🥩';
  if (b.sauce === 'だく') bowlEmoji += '💧💧';
  else if (b.sauce === '普通') bowlEmoji += '💧';
  if (b.negi) bowlEmoji += '🌿';
  document.getElementById('bowl').textContent = bowlEmoji;
}

function endGame(timeUp) {
  state.running = false;
  if (!state.submitted) { state.submitted = true; const s = state.score; setTimeout(() => window.GC && GC.submitScore(s), 1200); }
  document.getElementById('msgTitle').textContent = timeUp === 'giveup' ? '🏳️ ここで終了' : timeUp ? '🔔 営業終了' : '😣 ミスが多すぎた…';
  document.getElementById('msgText').textContent = `スコア: ${state.score}点 (ミス${state.miss}回)`;
  document.getElementById('msg').style.display = 'flex';
}

setInterval(update, 1000 / 60);
resetGame();
window.gcGiveUp = () => { if (state.running) endGame('giveup'); };
</script>
</body>
</html>
