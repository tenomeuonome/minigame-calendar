<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>わんこそば早食い</title>
<style>
  body {
    margin: 0;
    background: #3a1f12;
    color: #fff3e6;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 8px 0; }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 800px;
    max-width: 100%;
    margin-bottom: 8px;
    font-size: 14px;
  }
  #wrap { position: relative; }
  canvas { background: #fff8ec; border: 3px solid #8a5a30; border-radius: 10px; display: block; touch-action: none; }
  #stepLabel { text-align: center; font-size: 20px; margin: 8px 0 4px; }
  #judgeToast { text-align: center; font-size: 16px; font-weight: bold; height: 24px; }
  #msg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.78); border-radius: 10px; text-align: center; color: #fff;
  }
  #msg h2 { font-size: 26px; margin-bottom: 8px; }
  #msg p { color: #ddd; margin-bottom: 16px; white-space: pre-line; }
  #msg button { padding: 8px 20px; font-size: 15px; border-radius: 6px; border: none; background: #c0392b; color: #fff; cursor: pointer; }
  #help { max-width: 800px; font-size: 13px; color: #d8b89a; margin-top: 10px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
  <h1>🥢 わんこそば早食い</h1>
  <div id="hud">
    <div>食べた杯数: <span id="bowls">0</span>杯</div>
    <div>残り時間: <span id="time">50</span>秒</div>
    <div>コンボ: <span id="combo">0</span></div>
  </div>
  <div id="wrap">
    <div id="stepLabel"></div>
    <canvas id="game" width="800" height="90"></canvas>
    <div id="judgeToast"></div>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    「受け取る→口に入れる→噛む→飲む」の4工程を、バーのマーカーが黄色いゾーンに入った瞬間にスペース(またはタップ)。<br>
    真ん中の濃い部分でPERFECT、外側でもGOOD。外すとMISSでコンボが切れる。杯数が増えるほどマーカーが速くなる。
  </div>

<script>
const STEPS = [
  { key: 'receive', label: '🥢 そばを受け取る' },
  { key: 'mouth',   label: '😮 口に入れる' },
  { key: 'chew',    label: '😬 噛む' },
  { key: 'swallow', label: '😌 飲む' },
];
const ZONE_CENTER = 78; // 0-100の位置。ゾーンの中心
const GOOD_WIDTH = 16;
const PERFECT_WIDTH = 6;

let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    bowls: 0, combo: 0, score: 0, timeLeft: 50,
    stepIndex: 0, t: 0, speed: 0.045,
    running: true,
  };
  updateLabel();
}

function updateLabel() {
  document.getElementById('stepLabel').textContent = STEPS[state.stepIndex].label;
}

function markerPos() {
  return 50 + 50 * Math.sin(state.t); // 0〜100を往復
}

function judge() {
  if (!state.running) return;
  const pos = markerPos();
  const diff = Math.abs(pos - ZONE_CENTER);
  let result, points;
  if (diff <= PERFECT_WIDTH) { result = 'PERFECT'; points = 15; }
  else if (diff <= GOOD_WIDTH) { result = 'GOOD'; points = 8; }
  else { result = 'MISS'; points = 0; }

  const toast = document.getElementById('judgeToast');
  toast.textContent = result;
  toast.style.color = result === 'PERFECT' ? '#ffd24a' : result === 'GOOD' ? '#8fd14f' : '#e74c3c';

  if (result === 'MISS') {
    state.combo = 0;
  } else {
    state.combo++;
    state.score += Math.round(points * (1 + state.combo * 0.02));
  }

  state.stepIndex++;
  if (state.stepIndex >= STEPS.length) {
    state.stepIndex = 0;
    state.bowls++;
    state.speed = Math.min(0.11, state.speed + 0.004); // 1杯ごとに少し速くなる
    document.getElementById('bowls').textContent = state.bowls;
    if (result !== 'MISS') {
      toast.textContent = 'おかわり！ ' + result;
    }
  }
  updateLabel();
  document.getElementById('combo').textContent = state.combo;
}

document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); judge(); } });
document.getElementById('game').addEventListener('mousedown', judge);
document.getElementById('game').addEventListener('touchstart', e => { e.preventDefault(); judge(); }, { passive: false });

function update() {
  if (!state.running) return;
  state.t += state.speed;
  state.timeLeft -= 1/60;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));
  if (state.timeLeft <= 0) endGame();
}

function endGame() {
  state.running = false;
  if (!state.submitted) { state.submitted = true; const s = state.score; setTimeout(() => window.GC && GC.submitScore(s), 1200); }
  document.getElementById('msgTitle').textContent = '🍚 ごちそうさまでした';
  document.getElementById('msgText').textContent =
    `食べた杯数: ${state.bowls}杯\nスコア: ${state.score}点\n最大コンボは記録されてないけど、なかなかの腕前！`;
  document.getElementById('msg').style.display = 'flex';
}

function draw() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const barY = H / 2;
  const barX0 = 20, barX1 = W - 20;
  const toPx = (pct) => barX0 + (barX1 - barX0) * (pct / 100);

  // バー本体
  ctx.strokeStyle = '#8a5a30';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(barX0, barY);
  ctx.lineTo(barX1, barY);
  ctx.stroke();

  // GOODゾーン
  ctx.fillStyle = 'rgba(143,209,79,0.5)';
  ctx.fillRect(toPx(ZONE_CENTER - GOOD_WIDTH), barY - 14, toPx(ZONE_CENTER + GOOD_WIDTH) - toPx(ZONE_CENTER - GOOD_WIDTH), 28);
  // PERFECTゾーン
  ctx.fillStyle = 'rgba(255,210,74,0.8)';
  ctx.fillRect(toPx(ZONE_CENTER - PERFECT_WIDTH), barY - 14, toPx(ZONE_CENTER + PERFECT_WIDTH) - toPx(ZONE_CENTER - PERFECT_WIDTH), 28);

  // マーカー
  if (state.running) {
    const px = toPx(markerPos());
    ctx.beginPath();
    ctx.arc(px, barY, 13, 0, Math.PI * 2);
    ctx.fillStyle = '#c0392b';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.stroke();
  }
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

resetGame();
loop();
</script>
</body>
</html>
