<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ペンギンの素潜り漁</title>
<style>
  body {
    margin: 0;
    background: #0a2a40;
    color: #eaf6ff;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 8px 0; }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 800px;
    max-width: 100%;
    margin-bottom: 6px;
    font-size: 14px;
  }
  #oxyBar {
    width: 800px; max-width: 100%;
    height: 10px;
    background: #06192a;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  #oxyFill { height: 100%; width: 100%; background: linear-gradient(90deg,#6fd7ff,#1e9bd6); transition: width 0.1s linear; }
  #oxyFill.low { background: linear-gradient(90deg,#ffb84d,#ff6b4d); }
  #wrap { position: relative; }
  canvas { background: #06192a; border: 3px solid #0f4a6b; border-radius: 10px; display: block; }
  #msg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.78); border-radius: 10px; text-align: center;
  }
  #msg h2 { font-size: 26px; margin-bottom: 8px; }
  #msg p { color: #ddd; margin-bottom: 16px; }
  #msg button { padding: 8px 20px; font-size: 15px; border-radius: 6px; border: none; background: #2a9ad6; color: #fff; cursor: pointer; }
  #help { max-width: 800px; font-size: 13px; color: #9fc6db; margin-top: 10px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
  <h1>🐧 ペンギンの素潜り漁</h1>
  <div id="hud">
    <div>残り時間: <span id="time">60</span>秒</div>
    <div>🐟<span id="score">0</span>匹</div>
    <div>❤️<span id="lives">3</span></div>
  </div>
  <div id="oxyBar"><div id="oxyFill"></div></div>
  <div id="wrap">
    <canvas id="game" width="800" height="460"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    矢印キー / WASD で移動。氷(上の白いところ)は安全で酸素が回復する。海に潜ると魚(🐟)を捕れるが、酸素が減る。<br>
    サメ・シャチに触れるとライフが1減る。酸素が切れると自動的に氷へ戻される。ライフ0でゲームオーバー。
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const ICE_LINE = 90; // これより上が氷(安全地帯)

let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    player: { x: W/2, y: 50, speed: 2.6, invuln: 0 },
    fish: [],
    predators: [],
    score: 0,
    lives: 3,
    oxygen: 100,
    timeLeft: 60,
    keys: {},
    spawnTimer: 0,
    running: true,
  };
  for (let i = 0; i < 5; i++) spawnFish();
  spawnPredator('shark');
  spawnPredator('orca');
}

document.addEventListener('keydown', e => { state.keys[e.key] = true; });
document.addEventListener('keyup', e => { state.keys[e.key] = false; });

function randWaterPoint() {
  return { x: 20 + Math.random() * (W - 40), y: ICE_LINE + 20 + Math.random() * (H - ICE_LINE - 40) };
}

function spawnFish() {
  const p = randWaterPoint();
  state.fish.push({ x: p.x, y: p.y, target: randWaterPoint(), speed: 1.0 + Math.random() * 0.6 });
}

function spawnPredator(kind) {
  const p = randWaterPoint();
  state.predators.push({
    kind, x: p.x, y: p.y,
    target: randWaterPoint(),
    speed: kind === 'orca' ? 1.6 : 1.9,
  });
}

function moveTowards(entity, tx, ty, speed) {
  const dx = tx - entity.x, dy = ty - entity.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 2) return true;
  entity.x += (dx / dist) * speed;
  entity.y += (dy / dist) * speed;
  return false;
}

function updatePlayer() {
  const k = state.keys;
  let dx = 0, dy = 0;
  if (k['ArrowLeft'] || k['a']) dx -= 1;
  if (k['ArrowRight'] || k['d']) dx += 1;
  if (k['ArrowUp'] || k['w']) dy -= 1;
  if (k['ArrowDown'] || k['s']) dy += 1;
  const len = Math.hypot(dx, dy) || 1;
  const p = state.player;
  p.x = Math.max(16, Math.min(W - 16, p.x + (dx/len) * p.speed));
  p.y = Math.max(16, Math.min(H - 16, p.y + (dy/len) * p.speed));
  if (p.invuln > 0) p.invuln--;

  const inWater = p.y > ICE_LINE;
  if (inWater) {
    state.oxygen = Math.max(0, state.oxygen - 0.35);
    if (state.oxygen <= 0) {
      p.y = ICE_LINE - 20; // 酸素切れで強制的に氷へ
      p.invuln = 60;
    }
  } else {
    state.oxygen = Math.min(100, state.oxygen + 0.8);
  }
}

function updateFish() {
  for (const f of state.fish) {
    if (moveTowards(f, f.target.x, f.target.y, f.speed)) f.target = randWaterPoint();
  }
  for (let i = state.fish.length - 1; i >= 0; i--) {
    const f = state.fish[i];
    if (state.player.y > ICE_LINE && Math.hypot(f.x - state.player.x, f.y - state.player.y) < 22) {
      state.fish.splice(i, 1);
      state.score++;
    }
  }
  while (state.fish.length < 5) spawnFish();
}

function updatePredators() {
  for (const pr of state.predators) {
    const toPlayer = Math.hypot(pr.x - state.player.x, pr.y - state.player.y);
    if (state.player.y > ICE_LINE && toPlayer < 180) {
      moveTowards(pr, state.player.x, state.player.y, pr.speed);
    } else if (moveTowards(pr, pr.target.x, pr.target.y, pr.speed * 0.7)) {
      pr.target = randWaterPoint();
    }
    if (state.player.invuln <= 0 && state.player.y > ICE_LINE && toPlayer < 24) {
      state.lives--;
      state.player.invuln = 90;
      state.player.y = ICE_LINE - 20; // 氷へ逃げ戻る
      if (state.lives <= 0) return endGame(false);
    }
  }
}

function update() {
  if (!state.running) return;
  updatePlayer();
  updateFish();
  updatePredators();

  document.getElementById('score').textContent = state.score;
  document.getElementById('lives').textContent = Math.max(0, state.lives);
  const oxyFill = document.getElementById('oxyFill');
  oxyFill.style.width = state.oxygen + '%';
  oxyFill.classList.toggle('low', state.oxygen < 30);

  state.timeLeft -= 1/60;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));
  if (state.timeLeft <= 0) return endGame(true);
}

function endGame(timeUp) {
  state.running = false;
  if (!state.submitted) { state.submitted = true; const s = state.score; setTimeout(() => window.GC && GC.submitScore(s), 1200); }
  document.getElementById('msgTitle').textContent = timeUp === 'giveup' ? '🏳️ ここで終了' : timeUp ? '🧊 猟は終わり' : '😱 襲われた…';
  document.getElementById('msgText').textContent = `${state.score}匹の魚を捕った！`;
  document.getElementById('msg').style.display = 'flex';
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // 海
  const grad = ctx.createLinearGradient(0, ICE_LINE, 0, H);
  grad.addColorStop(0, '#1a6a96');
  grad.addColorStop(1, '#042338');
  ctx.fillStyle = grad;
  ctx.fillRect(0, ICE_LINE, W, H - ICE_LINE);

  // 氷
  ctx.fillStyle = '#eaf6ff';
  ctx.fillRect(0, 0, W, ICE_LINE);
  ctx.fillStyle = '#cfe9f5';
  ctx.fillRect(0, ICE_LINE - 8, W, 8);

  // 魚
  ctx.font = '22px sans-serif';
  for (const f of state.fish) ctx.fillText('🐟', f.x - 11, f.y + 11);

  // 天敵
  for (const pr of state.predators) {
    if (pr.kind === 'shark') {
      ctx.font = '30px sans-serif';
      ctx.fillText('🦈', pr.x - 15, pr.y + 15);
    } else {
      // シャチ(絵文字が無いので図形で描く)
      ctx.save();
      ctx.translate(pr.x, pr.y);
      ctx.fillStyle = '#10171c';
      ctx.beginPath();
      ctx.ellipse(0, 0, 26, 12, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#eef6fa';
      ctx.beginPath();
      ctx.ellipse(6, 4, 12, 6, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#10171c';
      ctx.beginPath();
      ctx.moveTo(-4, -10); ctx.lineTo(2, -24); ctx.lineTo(8, -10);
      ctx.fill();
      ctx.restore();
    }
  }

  // プレイヤー(ペンギン)
  const p = state.player;
  ctx.save();
  if (p.invuln > 0 && Math.floor(p.invuln / 6) % 2 === 0) ctx.globalAlpha = 0.4;
  ctx.font = '32px sans-serif';
  ctx.fillText('🐧', p.x - 16, p.y + 16);
  ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

resetGame();
loop();
window.gcGiveUp = () => { if (state.running) endGame('giveup'); };
</script>
</body>
</html>
