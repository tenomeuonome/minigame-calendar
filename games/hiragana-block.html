<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ひらがなブロック</title>
<style>
  body { margin:0; background:#1a1a2a; color:#eef; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:360px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; }
  canvas { background:#242440; border:3px solid #4a4a7a; border-radius:8px; display:block; }
  #wordToast { text-align:center; font-size:16px; font-weight:bold; height:24px; margin-top:8px; color:#ffd24a; }
  #ctl { display:flex; justify-content:center; gap:10px; margin-top:10px; width:360px; max-width:100%; }
  #ctl button { font-size:16px; padding:10px 16px; border-radius:8px; border:none; background:#4a4a7a; color:#fff; cursor:pointer; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#ffd24a; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:360px; font-size:13px; color:#bbd; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🀄 ひらがなブロック</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>連鎖: <span id="chain">0</span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="360" height="520"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="wordToast"></div>
  <div id="ctl">
    <button onclick="move(-1)">◀</button>
    <button onclick="softDrop()">▼</button>
    <button onclick="move(1)">▶</button>
    <button onclick="hardDrop()">⤓ 落とす</button>
  </div>
  <div id="help">
    矢印キー(←→↓)かボタンでひらがなブロックを動かす。積もった列・行のどこかに単語(2〜4文字)が<br>
    タテ・ヨコどちら向きでも完成すると消える。消えた後に落ちて繋がるとさらに連鎖、長い単語ほど高得点。
  </div>

<script>
const COLS = 6, ROWS = 12, CELL = 56;
const LETTERS = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split('');
const WEIGHTED = 'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろ'.split('');

const WORDS = [
  'いぬ','ねこ','うし','うま','くま','とり','さる','かに','たこ','いか',
  'もも','うめ','はな','やま','かわ','うみ','そら','つき','ほし','あめ',
  'ゆき','かぜ','くも','はる','なつ','あき','ふゆ','あさ','ひる','よる',
  'みず','ひと','くち','みみ','あし','て','め','からだ','あたま',
  'さくら','りんご','たまご','とけい','でんわ','がっこう','ほん','いす','つくえ','さかな',
  'くるま','でんしゃ','ひこうき','ふね','はし','みち','いえ','にわ','まど','とびら',
].sort((a,b) => b.length - a.length); // 長い単語を優先して検出

let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    grid: Array.from({length: ROWS}, () => Array(COLS).fill(null)),
    score: 0, chain: 0, running: true, dropTimer: 0,
  };
  spawnPiece();
  render();
}

function randLetter() { return WEIGHTED[Math.floor(Math.random() * WEIGHTED.length)]; }

function spawnPiece() {
  state.piece = { col: Math.floor(COLS/2), row: 0, letter: randLetter() };
  if (state.grid[0][state.piece.col]) { return endGame(); }
}

function move(dir) {
  if (!state.running) return;
  const nc = state.piece.col + dir;
  if (nc < 0 || nc >= COLS) return;
  if (state.grid[state.piece.row][nc]) return;
  state.piece.col = nc;
  render();
}

function softDrop() { dropOneStep(true); }

function dropOneStep(manual) {
  if (!state.running) return;
  const { row, col } = state.piece;
  if (row + 1 < ROWS && !state.grid[row + 1][col]) {
    state.piece.row++;
    if (manual) state.score += 1;
  } else {
    lockPiece();
  }
  render();
}

function hardDrop() {
  if (!state.running) return;
  while (true) {
    const { row, col } = state.piece;
    if (row + 1 < ROWS && !state.grid[row + 1][col]) { state.piece.row++; state.score += 2; }
    else break;
  }
  lockPiece();
  render();
}

function lockPiece() {
  const { row, col, letter } = state.piece;
  state.grid[row][col] = letter;
  resolveWords(0);
  spawnPiece();
}

function findWordRuns(lineArr) {
  // lineArr: 文字の配列(null含む)。null があれば連続が途切れる
  const text = lineArr.map(c => c || '　').join('');
  const hits = [];
  for (let len = 4; len >= 2; len--) {
    for (let start = 0; start + len <= text.length; start++) {
      const seg = text.slice(start, start + len);
      if (seg.includes('　')) continue;
      const rev = [...seg].reverse().join('');
      if (WORDS.includes(seg) || WORDS.includes(rev)) {
        hits.push({ start, len });
      }
    }
  }
  return hits;
}

function resolveWords(chainCount) {
  const toClear = new Set(); // "row,col"

  // 横方向
  for (let r = 0; r < ROWS; r++) {
    const hits = findWordRuns(state.grid[r]);
    hits.forEach(h => { for (let i = 0; i < h.len; i++) toClear.add(`${r},${h.start + i}`); });
  }
  // 縦方向
  for (let c = 0; c < COLS; c++) {
    const col = state.grid.map(row => row[c]);
    const hits = findWordRuns(col);
    hits.forEach(h => { for (let i = 0; i < h.len; i++) toClear.add(`${h.start + i},${c}`); });
  }

  if (toClear.size === 0) {
    if (chainCount > 0) { state.chain = chainCount; document.getElementById('chain').textContent = state.chain; }
    return;
  }

  // スコア加算(消えるマスの集合からだいたいの単語長で評価)
  const gained = toClear.size * 15 * (1 + chainCount * 0.5);
  state.score += Math.round(gained);
  document.getElementById('score').textContent = state.score;

  const toastEl = document.getElementById('wordToast');
  toastEl.textContent = chainCount > 0 ? `${chainCount + 1}連鎖！ +${Math.round(gained)}` : `単語成立！ +${Math.round(gained)}`;
  setTimeout(() => { if (toastEl.textContent.includes('成立') || toastEl.textContent.includes('連鎖')) toastEl.textContent = ''; }, 1000);

  toClear.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    state.grid[r][c] = null;
  });

  // 重力で詰める
  for (let c = 0; c < COLS; c++) {
    const colVals = [];
    for (let r = 0; r < ROWS; r++) if (state.grid[r][c]) colVals.push(state.grid[r][c]);
    for (let r = ROWS - 1, i = colVals.length - 1; r >= 0; r--, i--) {
      state.grid[r][c] = i >= 0 ? colVals[i] : null;
    }
  }

  resolveWords(chainCount + 1);
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') move(-1);
  if (e.key === 'ArrowRight' || e.key === 'd') move(1);
  if (e.key === 'ArrowDown' || e.key === 's') softDrop();
  if (e.code === 'Space') { e.preventDefault(); hardDrop(); }
});

function update() {
  if (!state.running) return;
  state.dropTimer++;
  const interval = Math.max(12, 36 - Math.floor(state.score / 400));
  if (state.dropTimer >= interval) {
    state.dropTimer = 0;
    dropOneStep(false);
  }
}

function endGame(title) {
  state.running = false;
  document.getElementById('msgTitle').textContent = title || '🀄 積みあがった！';
  document.getElementById('msgText').textContent = `スコア: ${state.score}点`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      ctx.strokeStyle = 'rgba(255,255,255,0.08)';
      ctx.strokeRect(c * CELL, r * CELL, CELL, CELL);
      const letter = state.grid[r][c];
      if (letter) {
        ctx.fillStyle = '#5a5aa0';
        ctx.fillRect(c * CELL + 2, r * CELL + 2, CELL - 4, CELL - 4);
        ctx.fillStyle = '#fff';
        ctx.font = '28px sans-serif';
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(letter, c * CELL + CELL/2, r * CELL + CELL/2 + 2);
      }
    }
  }

  if (state.piece && state.running) {
    const { row, col, letter } = state.piece;
    ctx.fillStyle = '#ffd24a';
    ctx.fillRect(col * CELL + 2, row * CELL + 2, CELL - 4, CELL - 4);
    ctx.fillStyle = '#2a2a2a';
    ctx.font = '28px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(letter, col * CELL + CELL/2, row * CELL + CELL/2 + 2);
  }
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

setInterval(update, 1000/30);
resetGame();
window.gcGiveUp = () => { if (state.running) endGame('🏳️ ここで終了'); };
</script>
</body>
</html>
