<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>素潜りチャレンジ</title>
<style>
  body { margin:0; background:#04223a; color:#eaf6ff; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:420px; max-width:100%; margin-bottom:8px; font-size:14px; gap:10px; flex-wrap:wrap; }
  #oxyWrap { width:110px; height:12px; background:#0a3550; border-radius:6px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px; }
  #oxyBar { height:100%; width:100%; background:#4ac0f0; }
  #wrap { position:relative; }
  canvas { background:linear-gradient(#2a8ad0,#021833); border:3px solid #0a3550; border-radius:10px; display:block; }
  #ctl { display:flex; justify-content:center; gap:10px; margin-top:12px; flex-wrap:wrap; }
  #ctl button { font-size:16px; padding:14px 22px; border-radius:12px; border:none; background:#2a6ac0; color:#fff; cursor:pointer; font-weight:bold; }
  #ctl button:active { background:#4a8ae0; }
  #upBtn { background:#e0a020; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:420px; font-size:13px; color:#bfe0f5; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🤿 素潜りチャレンジ</h1>
  <div id="hud">
    <div>深度: <span id="depth">0</span>m</div>
    <div>酸素: <span id="oxyWrap"><span id="oxyBar"></span></span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="420" height="440"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="ctl">
    <button id="btnL">🦵 左</button>
    <button id="btnR">🦵 右</button>
    <button id="upBtn">🔼 浮上する</button>
  </div>
  <div id="help">
    左右のボタン(または←→キー)を<b>交互に</b>押して手足を動かし、素潜りで深く潜る。
    同じ側を連続で押すと空ぶかしで酸素だけ減る。好きなタイミングで「浮上する」を押すと折り返し、
    交互キックで海面まで戻る。<b>酸素が尽きる前に海面に戻れなければ気絶して失敗</b>(スコア0)。
  </div>

<script>
const W = 420, H = 440, SURFACE_Y = 40, STEP = 2;
const OXY_MAX = 100, OXY_STROKE = 2.2, OXY_WASTE = 1.0, OXY_PASSIVE = 0.05;
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = { depth: 0, maxDepth: 0, oxygen: OXY_MAX, ascending: false, lastStroke: null, running: true, flash: null, flashTimer: 0 };
  updateHud();
  render();
}

function updateHud() {
  document.getElementById('depth').textContent = Math.round(state.maxDepth);
  document.getElementById('oxyBar').style.width = Math.max(0, state.oxygen) + '%';
  document.getElementById('oxyBar').style.background = state.oxygen < 30 ? '#e04a3a' : '#4ac0f0';
}

function stroke(side) {
  if (!state.running) return;
  if (side === state.lastStroke) {
    state.oxygen = Math.max(0, state.oxygen - OXY_WASTE);
    state.flash = '💦 空ぶかし…'; state.flashTimer = 14;
  } else {
    state.oxygen = Math.max(0, state.oxygen - OXY_STROKE);
    const dir = state.ascending ? -1 : 1;
    state.depth = Math.max(0, state.depth + dir * STEP);
    state.maxDepth = Math.max(state.maxDepth, state.depth);
    state.lastStroke = side;
  }
  updateHud();
}

function startAscend() {
  if (!state.running) return;
  state.ascending = true;
  state.flash = '🔼 浮上開始！'; state.flashTimer = 20;
}

document.getElementById('btnL').onclick = () => stroke('L');
document.getElementById('btnR').onclick = () => stroke('R');
document.getElementById('upBtn').onclick = startAscend;
document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight','ArrowUp'].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowLeft') stroke('L');
  if (e.key === 'ArrowRight') stroke('R');
  if (e.key === 'ArrowUp') startAscend();
});

function endGame(reason) {
  state.running = false;
  if (reason === 'faint') {
    document.getElementById('msgTitle').textContent = '😵 気絶してしまった…';
    document.getElementById('msgText').textContent = `最大深度: ${Math.round(state.maxDepth)}m(記録は無効)\nスコア: 0`;
  } else {
    document.getElementById('msgTitle').textContent = '🏖️ 無事に生還！';
    document.getElementById('msgText').textContent = `最大深度: ${Math.round(state.maxDepth)}m`;
  }
  document.getElementById('msg').style.display = 'flex';
  const score = reason === 'faint' ? 0 : Math.round(state.maxDepth);
  setTimeout(() => window.GC && GC.submitScore(score), 1200);
}

function update() {
  if (!state.running) return;
  if (state.flashTimer > 0) state.flashTimer--; else state.flash = null;

  state.oxygen = Math.max(0, state.oxygen - OXY_PASSIVE);
  if (state.oxygen <= 0) { updateHud(); return endGame('faint'); }
  if (state.ascending && state.depth <= 0) return endGame('surfaced');

  render();
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.fillRect(0, SURFACE_Y - 2, W, 3);
  ctx.font = '12px sans-serif'; ctx.fillStyle = '#dff0ff';
  ctx.fillText('海面', 6, SURFACE_Y - 6);

  const maxShowDepth = 300;
  const y = SURFACE_Y + (H - SURFACE_Y - 40) * Math.min(1, state.depth / maxShowDepth);

  ctx.font = '12px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.6)';
  for (let d = 20; d <= maxShowDepth; d += 20) {
    const ly = SURFACE_Y + (H - SURFACE_Y - 40) * (d / maxShowDepth);
    ctx.fillText(d + 'm', W - 36, ly);
  }

  ctx.font = '36px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(state.ascending ? '⬆️🤿' : '🤿', W / 2, y);
  ctx.textAlign = 'left';

  if (state.flash) {
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.fillText(state.flash, W / 2, 30); ctx.textAlign = 'left';
  }
}

setInterval(update, 1000 / 30);
resetGame();
window.gcGiveUp = () => {
  if (!state.running) return;
  state.running = false;
  const score = Math.round(state.maxDepth);
  document.getElementById('msgTitle').textContent = '🏳️ ここで終了';
  document.getElementById('msgText').textContent = `最大深度: ${score}m`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(score), 1200);
};
</script>
</body>
</html>
