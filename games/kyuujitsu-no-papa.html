<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休日のパパ</title>
<style>
  body { margin:0; background:#3a2a1a; color:#f5ece0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:600px; max-width:100%; margin-bottom:8px; font-size:14px; gap:10px; flex-wrap:wrap; }
  #wrap { position:relative; }
  canvas { background:#d8c8a0; border:3px solid #7a5a3a; border-radius:10px; display:block; touch-action:none; }
  #ctl { display:grid; grid-template-columns:repeat(3,60px); grid-template-rows:repeat(3,48px); gap:6px; margin-top:12px; justify-content:center; }
  #ctl button { font-size:16px; border-radius:10px; border:none; background:#8a6a3a; color:#fff; cursor:pointer; user-select:none; }
  #ctl button:active { background:#aa8a5a; }
  #btnUp { grid-column:2; grid-row:1; } #btnDown { grid-column:2; grid-row:3; }
  #btnLeft { grid-column:1; grid-row:2; } #btnRight { grid-column:3; grid-row:2; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:600px; font-size:13px; color:#e0d0b0; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🛋️ 休日のパパ</h1>
  <div id="hud">
    <div>のんびり時間: <span id="time">0</span>秒</div>
    <div>バレ: <span id="lives">💢💢💢</span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="600" height="380"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="ctl">
    <button id="btnUp">▲</button>
    <button id="btnLeft">◀</button>
    <button id="btnRight">▶</button>
    <button id="btnDown">▼</button>
  </div>
  <div id="help">
    矢印キー(↑↓←→)で、ひじをついて寝転がったまま床をゴロゴロ逃げ回る。
    掃除機🧹は一定のパターンで床を掃いてくる。こども🧒は「!」で予告したあと一直線にダッシュしてくるので早めに避ける。
    3回つかまったらゲームオーバー。スコアはのんびりできた時間。
  </div>

<script>
const W = 600, H = 380, PAPA_R = 18;
let state = {};
let input = { up: false, down: false, left: false, right: false };

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    x: W / 2, y: H / 2, vx: 0, vy: 0, running: true, lives: 3, frame: 0,
    vac: { x: 30, y: 30, dir: 1, row: 0 }, kids: [], kidTimer: 150, flash: null, flashTimer: 0, invuln: 0,
  };
  updateHud();
  render();
}

function updateHud() {
  document.getElementById('time').textContent = Math.floor(state.frame / 30);
  document.getElementById('lives').textContent = '💢'.repeat(state.lives) + '🙂'.repeat(3 - state.lives);
}

function bindHold(el, onFlag) {
  const set = v => e => { e.preventDefault(); onFlag(v); };
  el.addEventListener('pointerdown', set(true));
  el.addEventListener('pointerup', set(false));
  el.addEventListener('pointercancel', set(false));
  el.addEventListener('pointerleave', set(false));
}
bindHold(document.getElementById('btnUp'), v => input.up = v);
bindHold(document.getElementById('btnDown'), v => input.down = v);
bindHold(document.getElementById('btnLeft'), v => input.left = v);
bindHold(document.getElementById('btnRight'), v => input.right = v);
document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowUp') input.up = true;
  if (e.key === 'ArrowDown') input.down = true;
  if (e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'ArrowRight') input.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') input.up = false;
  if (e.key === 'ArrowDown') input.down = false;
  if (e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'ArrowRight') input.right = false;
});

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function updateVac() {
  const v = state.vac;
  const margin = 24, rowH = 54;
  v.x += v.dir * 1.9;
  if (v.x > W - margin) { v.x = W - margin; v.dir = -1; v.row++; }
  if (v.x < margin) { v.x = margin; v.dir = 1; v.row++; }
  v.y = margin + (v.row * rowH) % (H - margin * 2);
}

function spawnKid() {
  const edge = Math.floor(Math.random() * 4);
  const pos = edge === 0 ? { x: Math.random() * W, y: -20 } : edge === 1 ? { x: Math.random() * W, y: H + 20 }
    : edge === 2 ? { x: -20, y: Math.random() * H } : { x: W + 20, y: Math.random() * H };
  state.kids.push({ ...pos, phase: 'wind', timer: 18, tx: 0, ty: 0 });
}

function hitPapa(name) {
  if (state.invuln > 0) return;
  state.lives--; state.invuln = 45;
  state.flash = `😱 ${name}に見つかった！`; state.flashTimer = 24;
  updateHud();
  if (state.lives <= 0) endGame();
}

function update() {
  if (!state.running) return;
  state.frame++;
  if (state.invuln > 0) state.invuln--;
  if (state.flashTimer > 0) state.flashTimer--; else state.flash = null;

  let tvx = 0, tvy = 0;
  if (input.up) tvy -= 1.5; if (input.down) tvy += 1.5;
  if (input.left) tvx -= 1.5; if (input.right) tvx += 1.5;
  state.vx += (tvx - state.vx) * 0.2; state.vy += (tvy - state.vy) * 0.2;
  state.x = clamp(state.x + state.vx, 20, W - 20);
  state.y = clamp(state.y + state.vy, 20, H - 20);

  updateVac();
  if (Math.hypot(state.vac.x - state.x, state.vac.y - state.y) < PAPA_R + 16) hitPapa('掃除機');

  state.kidTimer--;
  if (state.kidTimer <= 0) { spawnKid(); state.kidTimer = Math.max(80, 180 - state.frame * 0.15) + Math.random() * 60; }

  for (let i = state.kids.length - 1; i >= 0; i--) {
    const k = state.kids[i];
    if (k.phase === 'wind') {
      k.timer--;
      if (k.timer <= 0) { k.phase = 'dash'; k.tx = state.x; k.ty = state.y; k.timer = 40; }
    } else {
      const dx = k.tx - k.x, dy = k.ty - k.y, dist = Math.hypot(dx, dy) || 1;
      k.x += (dx / dist) * 6.5; k.y += (dy / dist) * 6.5;
      k.timer--;
      if (Math.hypot(k.x - state.x, k.y - state.y) < PAPA_R + 14) { hitPapa('こども'); state.kids.splice(i, 1); continue; }
      if (k.timer <= 0 || k.x < -40 || k.x > W + 40 || k.y < -40 || k.y > H + 40) state.kids.splice(i, 1);
    }
  }

  updateHud();
  render();
}

function endGame(title) {
  state.running = false;
  document.getElementById('msgTitle').textContent = title || '📢 お父さん業務発生…';
  document.getElementById('msgText').textContent = `のんびりできた時間: ${Math.floor(state.frame / 30)}秒`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(Math.floor(state.frame / 30)), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(120,90,50,0.2)'; ctx.lineWidth = 2;
  for (let x = 40; x < W; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }

  ctx.font = '30px sans-serif';
  ctx.fillText('🧹', state.vac.x - 15, state.vac.y + 10);

  state.kids.forEach(k => {
    ctx.font = '28px sans-serif';
    ctx.fillText('🧒', k.x - 14, k.y + 10);
    if (k.phase === 'wind') {
      ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#e04a3a';
      ctx.fillText('！', k.x - 5, k.y - 18);
    }
  });

  ctx.font = '32px sans-serif';
  ctx.globalAlpha = state.invuln > 0 && state.invuln % 10 < 5 ? 0.4 : 1;
  ctx.fillText('🧔‍♂️💤', state.x - 24, state.y + 10);
  ctx.globalAlpha = 1;

  if (state.flash) {
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#7a2a2a';
    ctx.textAlign = 'center'; ctx.fillText(state.flash, W / 2, 26); ctx.textAlign = 'left';
  }
}

setInterval(update, 1000 / 30);
resetGame();
window.gcGiveUp = () => { if (state.running) endGame('🏳️ ここで終了'); };
</script>
</body>
</html>
