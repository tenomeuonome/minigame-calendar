<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>バランス綱渡り</title>
<style>
  body { margin:0; background:#1a2a3a; color:#eaf4ff; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:800px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; }
  canvas { background:linear-gradient(#bde6ff, #e8f8ff); border:3px solid #1a4a6a; border-radius:10px; display:block; }
  #ctl { display:flex; justify-content:center; gap:30px; margin-top:14px; width:800px; max-width:100%; }
  #ctl button { font-size:22px; padding:16px 36px; border-radius:12px; border:none; background:#2a6a9a; color:#fff; cursor:pointer; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.78); border-radius:10px; text-align:center; }
  #msg h2 { font-size:26px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#4ad1ff; color:#06121f; cursor:pointer; font-weight:bold; }
  #help { max-width:800px; font-size:13px; color:#a9d4e2; margin-top:10px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🤸‍♂️ バランス綱渡り</h1>
  <div id="hud">
    <div>進んだ距離: <span id="dist">0</span>m</div>
  </div>
  <div id="wrap">
    <canvas id="game" width="800" height="300"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="ctl">
    <button onmousedown="press('L')" ontouchstart="press('L')">◀ 左</button>
    <button onmousedown="press('R')" ontouchstart="press('R')">右 ▶</button>
  </div>
  <div id="help">
    綱の上を自動で歩き続ける。バランスが左右に崩れてくるので、傾いた方と<b>反対のボタン</b>を押して立て直す。<br>
    押しすぎると逆に傾くので、回数の加減がコツ。倒れたらゲームオーバー。矢印キーでも操作できる。
  </div>

<script>
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = { dist: 0, balance: 0, wind: 0.35, running: true };
}

function press(dir) {
  if (!state.running) return;
  state.balance += dir === 'L' ? -9 : 9;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a') press('L');
  if (e.key === 'ArrowRight' || e.key === 'd') press('R');
});

function update() {
  if (!state.running) return;
  // 風でだんだん傾く。進むほど風が強くなる
  state.balance += (Math.random() - 0.5) * state.wind;
  state.wind = Math.min(1.2, 0.35 + state.dist / 400);

  // 自然な復元(摩擦)
  state.balance *= 0.995;

  if (Math.abs(state.balance) >= 100) return endGame();

  state.dist += 0.12;
  document.getElementById('dist').textContent = Math.round(state.dist);
  render();
}

function endGame(title) {
  state.running = false;
  const score = Math.round(state.dist);
  document.getElementById('msgTitle').textContent = title || '💦 落ちた！';
  document.getElementById('msgText').textContent = `進んだ距離: ${score}m`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(score), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // 綱
  ctx.strokeStyle = '#8a6a3a';
  ctx.lineWidth = 6;
  ctx.beginPath();
  ctx.moveTo(0, H - 60);
  ctx.lineTo(W, H - 60);
  ctx.stroke();

  // 人(傾き具合を回転で表現)
  const tilt = (state.balance / 100) * 0.9;
  ctx.save();
  ctx.translate(W / 2, H - 60);
  ctx.rotate(tilt);
  ctx.font = '50px sans-serif';
  ctx.fillText('🤸‍♂️', -25, -10);
  ctx.restore();

  // バランスメーター
  const barW = 300, barX = W/2 - barW/2, barY = 20;
  ctx.fillStyle = 'rgba(255,255,255,0.6)';
  ctx.fillRect(barX, barY, barW, 14);
  ctx.fillStyle = Math.abs(state.balance) > 70 ? '#d9534f' : Math.abs(state.balance) > 40 ? '#e0a33a' : '#2a6a9a';
  const pos = barX + barW/2 + (state.balance / 100) * (barW/2);
  ctx.fillRect(pos - 4, barY - 4, 8, 22);
}

function loop() { update(); requestAnimationFrame(loop); }
resetGame();
loop();
window.gcGiveUp = () => { if (state.running) endGame('🏳️ ここで終了'); };
</script>
</body>
</html>
