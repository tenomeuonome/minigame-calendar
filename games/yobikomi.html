<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>こっそり呼び込み</title>
<style>
  body {
    margin: 0;
    background: #0d0a1a;
    color: #f0e9ff;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 8px 0; }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 800px;
    max-width: 100%;
    margin-bottom: 8px;
    font-size: 14px;
  }
  #wrap { position: relative; }
  canvas { background: linear-gradient(#1b1430, #2a1f45); border: 3px solid #4a3a6a; border-radius: 10px; display: block; }
  #warnBar {
    width: 800px; max-width: 100%;
    height: 10px;
    background: #2a1f45;
    border-radius: 5px;
    overflow: hidden;
    margin-bottom: 6px;
  }
  #warnFill { height: 100%; width: 0%; background: linear-gradient(90deg,#ffca5f,#ff4d4d); transition: width 0.15s linear; }
  #msg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.8); border-radius: 10px; text-align: center;
  }
  #msg h2 { font-size: 26px; margin-bottom: 8px; }
  #msg p { color: #ddd; margin-bottom: 16px; }
  #msg button { padding: 8px 20px; font-size: 15px; border-radius: 6px; border: none; background: #e0507a; color: #fff; cursor: pointer; }
  #help { max-width: 800px; font-size: 13px; color: #b9a8d9; margin-top: 10px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
  <h1>🏮 こっそり呼び込み</h1>
  <div id="hud">
    <div>残り時間: <span id="time">60</span>秒</div>
    <div>案内できたお客さん: <span id="score">0</span>人</div>
  </div>
  <div id="warnBar"><div id="warnFill"></div></div>
  <div id="wrap">
    <canvas id="game" width="800" height="500"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    矢印キー / WASD で移動。お客さん(🚶)に近づいて<b>スペース</b>で声をかけると、お店(🏮)へ案内できる。<br>
    ガラの悪い人(😠)に近づかれると警戒ゲージが上がる。満タンになるとゲームオーバー。
  </div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const SHOP = { x: W / 2, y: H - 30 };

let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    player: { x: W/2, y: H/2, speed: 3 },
    customers: [],
    thugs: [],
    score: 0,
    warn: 0,
    timeLeft: 60,
    keys: {},
    inviteCooldown: 0,
    spawnTimer: 0,
    running: true,
  };
  for (let i = 0; i < 3; i++) spawnThug();
}

document.addEventListener('keydown', e => {
  state.keys[e.key] = true;
  if (e.code === 'Space') { e.preventDefault(); tryInvite(); }
});
document.addEventListener('keyup', e => { state.keys[e.key] = false; });

function edgeSpawnPoint() {
  const side = Math.floor(Math.random() * 3); // 下(お店の前)以外の3辺
  if (side === 0) return { x: Math.random() * W, y: 0 };
  if (side === 1) return { x: 0, y: 100 + Math.random() * (H - 150) };
  return { x: W, y: 100 + Math.random() * (H - 150) };
}

function spawnCustomer() {
  const p = edgeSpawnPoint();
  state.customers.push({
    x: p.x, y: p.y, speed: 0.7 + Math.random() * 0.4,
    heading: null, invited: false,
    wanderTarget: edgeSpawnPoint(),
  });
}

function spawnThug() {
  const p = edgeSpawnPoint();
  state.thugs.push({ x: p.x, y: p.y, speed: 0.9, target: edgeSpawnPoint(), pauseTimer: 0 });
}

function moveTowards(entity, tx, ty, speed) {
  const dx = tx - entity.x, dy = ty - entity.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 2) return true;
  entity.x += (dx / dist) * speed;
  entity.y += (dy / dist) * speed;
  return false;
}

function updatePlayer() {
  const k = state.keys;
  let dx = 0, dy = 0;
  if (k['ArrowLeft'] || k['a']) dx -= 1;
  if (k['ArrowRight'] || k['d']) dx += 1;
  if (k['ArrowUp'] || k['w']) dy -= 1;
  if (k['ArrowDown'] || k['s']) dy += 1;
  const len = Math.hypot(dx, dy) || 1;
  state.player.x = Math.max(14, Math.min(W - 14, state.player.x + (dx/len) * state.player.speed));
  state.player.y = Math.max(14, Math.min(H - 14, state.player.y + (dy/len) * state.player.speed));
}

function tryInvite() {
  if (state.inviteCooldown > 0) return;
  state.inviteCooldown = 30;
  for (const c of state.customers) {
    if (c.invited) continue;
    if (Math.hypot(c.x - state.player.x, c.y - state.player.y) < 36) {
      c.invited = true;
      return;
    }
  }
}

function update() {
  if (!state.running) return;
  if (state.inviteCooldown > 0) state.inviteCooldown--;

  state.spawnTimer--;
  if (state.spawnTimer <= 0) {
    spawnCustomer();
    state.spawnTimer = 70 + Math.random() * 50;
  }

  updatePlayer();

  // 客の移動: 案内されたらお店へ、それ以外はふらふら歩く
  for (let i = state.customers.length - 1; i >= 0; i--) {
    const c = state.customers[i];
    if (c.invited) {
      if (moveTowards(c, SHOP.x, SHOP.y, c.speed * 1.8)) {
        state.customers.splice(i, 1);
        state.score++;
      }
    } else {
      if (moveTowards(c, c.wanderTarget.x, c.wanderTarget.y, c.speed)) {
        if (Math.random() < 0.3) { state.customers.splice(i, 1); } // そのまま帰ってしまう
        else c.wanderTarget = edgeSpawnPoint();
      }
    }
  }

  // ガラの悪い人: 適当に歩き回る。近づくと警戒ゲージが上がる
  for (const t of state.thugs) {
    if (moveTowards(t, t.target.x, t.target.y, t.speed)) t.target = edgeSpawnPoint();
    if (Math.hypot(t.x - state.player.x, t.y - state.player.y) < 50) {
      state.warn = Math.min(100, state.warn + 1.2);
    }
  }
  state.warn = Math.max(0, state.warn - 0.3); // 離れていれば自然に下がる

  document.getElementById('score').textContent = state.score;
  document.getElementById('warnFill').style.width = state.warn + '%';

  state.timeLeft -= 1/60;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));

  if (state.warn >= 100) return endGame(false, '絡まれて、お店の前から追い払われてしまった…');
  if (state.timeLeft <= 0) return endGame(true, `今日は${state.score}人を案内できた！`);
}

function endGame(win, text) {
  state.running = false;
  document.getElementById('msgTitle').textContent = win ? '🎉 営業終了' : '😵 トラブル発生';
  document.getElementById('msgText').textContent = text;
  document.getElementById('msg').style.display = 'flex';
  const finalScore = state.score;
  setTimeout(() => window.GC && GC.submitScore(finalScore), 1200);
}

function draw() {
  ctx.clearRect(0, 0, W, H);

  // お店の入口
  ctx.font = '36px sans-serif';
  ctx.fillText('🏮', SHOP.x - 18, SHOP.y + 14);

  ctx.font = '26px sans-serif';
  for (const c of state.customers) ctx.fillText(c.invited ? '🙂' : '🚶', c.x - 13, c.y + 13);
  for (const t of state.thugs) ctx.fillText('😠', t.x - 13, t.y + 13);

  ctx.font = '28px sans-serif';
  ctx.fillText('🧍', state.player.x - 14, state.player.y + 14);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

resetGame();
loop();
</script>
</body>
</html>
