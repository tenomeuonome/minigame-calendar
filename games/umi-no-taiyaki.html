<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>海に逃げたたい焼き君</title>
<style>
  body { margin:0; background:#032a4a; color:#eaf6ff; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:640px; max-width:100%; margin-bottom:8px; font-size:14px; gap:10px; flex-wrap:wrap; }
  #wrap { position:relative; }
  canvas { background:linear-gradient(#1a6aa0,#02203a); border:3px solid #0a3550; border-radius:10px; display:block; touch-action:none; }
  #ctl { display:grid; grid-template-columns:repeat(3,60px); grid-template-rows:repeat(3,48px); gap:6px; margin-top:12px; justify-content:center; }
  #ctl button { font-size:16px; border-radius:10px; border:none; background:#2a6ac0; color:#fff; cursor:pointer; user-select:none; }
  #ctl button:active { background:#4a8ae0; }
  #btnUp { grid-column:2; grid-row:1; } #btnDown { grid-column:2; grid-row:3; }
  #btnLeft { grid-column:1; grid-row:2; } #btnRight { grid-column:3; grid-row:2; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:640px; font-size:13px; color:#bfe0f5; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🐟 海に逃げたたい焼き君</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div id="status">🌊 のんびり泳ぎ中</div>
  </div>
  <div id="wrap">
    <canvas id="game" width="640" height="400"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="ctl">
    <button id="btnUp">▲</button>
    <button id="btnLeft">◀</button>
    <button id="btnRight">▶</button>
    <button id="btnDown">▼</button>
  </div>
  <div id="help">
    矢印キー(↑↓←→)で自由に泳いで、小さな生き物🦐🐠を食べてスコアを稼ぐ。
    釣り針🪝が垂れてきたら、針が光ってる(餌がついてる)うちに体当たりして<b>餌を食いちぎれば安全</b>。
    無視すると針が急にダッシュしてくる。それに当たったら「釣りゲーの逆」で、たい焼き君が釣られてゲームオーバー。
  </div>

<script>
const W = 640, H = 400;
let state = {};
let input = { up: false, down: false, left: false, right: false };

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    x: W / 2, y: H / 2, vx: 0, vy: 0, score: 0, running: true,
    foods: [], hooks: [], foodTimer: 40, hookTimer: 240, flash: null, flashTimer: 0,
  };
  updateHud();
  render();
}

function updateHud() { document.getElementById('score').textContent = state.score; }

function bindHold(el, onFlag) {
  const set = v => e => { e.preventDefault(); onFlag(v); };
  el.addEventListener('pointerdown', set(true));
  el.addEventListener('pointerup', set(false));
  el.addEventListener('pointercancel', set(false));
  el.addEventListener('pointerleave', set(false));
}
bindHold(document.getElementById('btnUp'), v => input.up = v);
bindHold(document.getElementById('btnDown'), v => input.down = v);
bindHold(document.getElementById('btnLeft'), v => input.left = v);
bindHold(document.getElementById('btnRight'), v => input.right = v);
document.addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowUp') input.up = true;
  if (e.key === 'ArrowDown') input.down = true;
  if (e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'ArrowRight') input.right = true;
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowUp') input.up = false;
  if (e.key === 'ArrowDown') input.down = false;
  if (e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'ArrowRight') input.right = false;
});

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function spawnFood() {
  state.foods.push({ x: 20 + Math.random() * (W - 40), y: 20 + Math.random() * (H - 40), icon: Math.random() < 0.5 ? '🦐' : '🐠', vx: (Math.random() - 0.5) * 0.6, vy: (Math.random() - 0.5) * 0.6 });
}
function spawnHook() {
  state.hooks.push({ x: 40 + Math.random() * (W - 80), y: -20, phase: 'descend', timer: 150, targetY: 100 + Math.random() * 150, tx: 0, ty: 0 });
}

function update() {
  if (!state.running) return;
  if (state.flashTimer > 0) state.flashTimer--; else state.flash = null;

  let tvx = 0, tvy = 0;
  if (input.up) tvy -= 2.6; if (input.down) tvy += 2.6;
  if (input.left) tvx -= 2.6; if (input.right) tvx += 2.6;
  state.vx += (tvx - state.vx) * 0.15; state.vy += (tvy - state.vy) * 0.15;
  state.x = clamp(state.x + state.vx, 16, W - 16);
  state.y = clamp(state.y + state.vy, 16, H - 16);

  state.foodTimer--;
  if (state.foodTimer <= 0) { if (state.foods.length < 6) spawnFood(); state.foodTimer = 35 + Math.random() * 30; }
  state.hookTimer--;
  if (state.hookTimer <= 0) { spawnHook(); state.hookTimer = 260 + Math.random() * 180 - Math.min(150, state.score * 0.3); }

  state.foods.forEach(f => { f.x += f.vx; f.y += f.vy; if (f.x < 10 || f.x > W - 10) f.vx *= -1; if (f.y < 10 || f.y > H - 10) f.vy *= -1; });
  for (let i = state.foods.length - 1; i >= 0; i--) {
    const f = state.foods[i];
    if (Math.hypot(f.x - state.x, f.y - state.y) < 20) {
      state.score += 5; state.foods.splice(i, 1); updateHud();
    }
  }

  const statusEl = document.getElementById('status');
  let anyDanger = false;
  for (let i = state.hooks.length - 1; i >= 0; i--) {
    const h = state.hooks[i];
    if (h.phase === 'descend') {
      h.y += 1.6;
      if (h.y >= h.targetY) h.phase = 'wait';
      if (Math.hypot(h.x - state.x, h.y - state.y) < 22) {
        state.score += 30; state.flash = '✂️ 餌を食いちぎった！'; state.flashTimer = 24;
        state.hooks.splice(i, 1); updateHud(); continue;
      }
      anyDanger = true;
    } else if (h.phase === 'wait') {
      h.timer--;
      if (Math.hypot(h.x - state.x, h.y - state.y) < 22) {
        state.score += 30; state.flash = '✂️ 餌を食いちぎった！'; state.flashTimer = 24;
        state.hooks.splice(i, 1); updateHud(); continue;
      }
      if (h.timer <= 0) { h.phase = 'strike'; h.tx = state.x; h.ty = state.y; h.strikeTimer = 18; }
      anyDanger = true;
    } else if (h.phase === 'strike') {
      h.x += (h.tx - h.x) * 0.35; h.y += (h.ty - h.y) * 0.35;
      h.strikeTimer--;
      if (Math.hypot(h.x - state.x, h.y - state.y) < 20) return endGame();
      if (h.strikeTimer <= 0) state.hooks.splice(i, 1);
      anyDanger = true;
    }
  }
  statusEl.textContent = anyDanger ? '🪝 釣り針に注意！' : '🌊 のんびり泳ぎ中';

  render();
}

function endGame(title) {
  state.running = false;
  document.getElementById('msgTitle').textContent = title || '🎣 釣られてしまった…';
  document.getElementById('msgText').textContent = `スコア: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  ctx.font = '26px sans-serif';
  state.foods.forEach(f => ctx.fillText(f.icon, f.x - 13, f.y + 9));

  state.hooks.forEach(h => {
    ctx.strokeStyle = 'rgba(255,255,255,0.5)'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(h.x, 0); ctx.lineTo(h.x, h.y); ctx.stroke();
    ctx.font = '28px sans-serif';
    const icon = h.phase === 'strike' ? '🪝' : '🪱';
    ctx.fillText(icon, h.x - 14, h.y + 10);
    if (h.phase === 'wait') {
      ctx.fillStyle = h.timer < 50 ? '#e04a3a' : '#f0c020';
      ctx.fillRect(h.x - 16, h.y + 16, 32 * (h.timer / 150), 4);
    }
  });

  ctx.font = '34px sans-serif';
  ctx.fillText('🐟', state.x - 17, state.y + 11);

  if (state.flash) {
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.fillText(state.flash, W / 2, 26); ctx.textAlign = 'left';
  }
}

setInterval(update, 1000 / 30);
resetGame();
window.gcGiveUp = () => { if (state.running) endGame('🏳️ ここで終了'); };
</script>
</body>
</html>
