<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眠れる森の美女</title>
<style>
  body { margin:0; background:#2a1a3a; color:#f5e9ff; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:420px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; width:420px; max-width:100%; }
  #stage { background:#fff; border:3px solid #c9a0d8; border-radius:14px; padding:30px 20px; text-align:center; color:#3a2a4a; }
  #visitor { font-size:64px; margin-bottom:10px; }
  #visitorLabel { font-size:14px; color:#777; margin-bottom:10px; }
  .patience-bar { height:8px; background:#eee; border-radius:4px; overflow:hidden; margin:10px auto 16px; width:260px; }
  .patience-fill { height:100%; background:#6cc070; transition:width 0.1s linear; }
  .patience-fill.warn { background:#e0a33a; }
  .patience-fill.danger { background:#d9534f; }
  #btns { display:flex; justify-content:center; gap:20px; }
  #btns button { font-size:16px; padding:12px 22px; border-radius:10px; border:none; cursor:pointer; font-weight:bold; color:#fff; }
  #acceptBtn { background:#e0507a; }
  #rejectBtn { background:#556070; }
  #toast { text-align:center; font-size:14px; font-weight:bold; height:20px; margin-top:10px; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.78); border-radius:14px; text-align:center; color:#fff; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#9a5ac0; color:#fff; cursor:pointer; margin-top:8px; }
  #help { max-width:420px; font-size:13px; color:#d8c0e8; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>👸 眠れる森の美女</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>残り時間: <span id="time">45</span>秒</div>
    <div>ミス: <span id="miss">0</span> / 5</div>
  </div>
  <div id="wrap">
    <div id="stage">
      <div id="visitor"></div>
      <div id="visitorLabel"></div>
      <div class="patience-bar"><div class="patience-fill" id="patienceFill"></div></div>
      <div id="btns">
        <button id="acceptBtn" onclick="decide(true)">💋 受け入れる</button>
        <button id="rejectBtn" onclick="decide(false)">🙅 拒否する</button>
      </div>
      <div id="toast"></div>
    </div>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    やってきた相手が<b>美青年</b>ならキスを受け入れる、それ以外(ブサイク・年寄り・子供)なら拒否する。<br>
    判断が遅れるとそのまま時間切れでミス。ミス5回でゲームオーバー、45秒で何人さばけるか。
  </div>

<script>
const VISITORS = [
  { emoji: '🤴', label: '美青年の王子様', ok: true },
  { emoji: '🧑‍🎤', label: '麗しい青年', ok: true },
  { emoji: '🥳', label: 'キラキラ美青年', ok: true },
  { emoji: '👴', label: 'おじいさん', ok: false },
  { emoji: '👶', label: '赤ちゃん', ok: false },
  { emoji: '🧒', label: '子供', ok: false },
  { emoji: '🧌', label: 'ブサイクなトロール', ok: false },
  { emoji: '🧟', label: 'ゾンビ', ok: false },
  { emoji: '🐸', label: 'カエル(まだ人間じゃない)', ok: false },
];

let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = { score: 0, miss: 0, timeLeft: 45, patience: 1, visitor: null, running: true, locked: false };
  nextVisitor();
}

function nextVisitor() {
  state.visitor = VISITORS[Math.floor(Math.random() * VISITORS.length)];
  state.patience = 1;
  state.locked = false;
  document.getElementById('visitor').textContent = state.visitor.emoji;
  document.getElementById('visitorLabel').textContent = state.visitor.label;
}

function toast(text, ok) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.style.color = ok ? '#2e7d32' : '#c0392b';
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 700);
}

function decide(accept) {
  if (!state.running || state.locked) return;
  state.locked = true;
  const correct = accept === state.visitor.ok;
  if (correct) {
    state.score += 20;
    toast('正しい判断！', true);
  } else {
    state.miss++;
    toast(accept ? 'まさかの相手にキスされた…' : '素敵な人を逃した…', false);
  }
  document.getElementById('score').textContent = state.score;
  document.getElementById('miss').textContent = state.miss;
  if (state.miss >= 5) { return endGame(false); }
  setTimeout(nextVisitor, 350);
}

function update() {
  if (!state.running || state.locked) return;
  state.patience -= 1 / 220;
  if (state.patience <= 0) {
    state.locked = true;
    state.miss++;
    toast('ためらっているうちに去ってしまった…', false);
    document.getElementById('miss').textContent = state.miss;
    if (state.miss >= 5) { return endGame(false); }
    setTimeout(nextVisitor, 350);
    return;
  }
  const bar = document.getElementById('patienceFill');
  const pct = Math.max(0, state.patience * 100);
  bar.style.width = pct + '%';
  bar.className = 'patience-fill' + (pct < 25 ? ' danger' : pct < 55 ? ' warn' : '');

  state.timeLeft -= 1/60;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));
  if (state.timeLeft <= 0) endGame(true);
}

function endGame(timeUp) {
  state.running = false;
  document.getElementById('msgTitle').textContent = timeUp ? '🌹 まだ眠り姫のまま' : '😵 評判が落ちた…';
  document.getElementById('msgText').textContent = `スコア: ${state.score}点 (ミス${state.miss}回)`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

setInterval(update, 1000/60);
resetGame();
</script>
</body>
</html>
