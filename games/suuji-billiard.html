<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数字ビリヤード</title>
<style>
  body { margin:0; background:#1a2a1a; color:#eafaf0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:620px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; }
  canvas { background:#1a5a2a; border:8px solid #4a2a10; border-radius:10px; display:block; touch-action:none; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.85); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:620px; font-size:13px; color:#c8e8d0; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🎱 数字ビリヤード</h1>
  <div id="hud">
    <div>消した球: <span id="cleared">0</span>個</div>
    <div>スコア: <span id="score">0</span></div>
    <div>残り球数: <span id="shots">20</span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="620" height="380"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    球をタップして選び、引っ張って離すと逆方向に発射(通常のビリヤードと同じ)。
    <b>自分の数字で割り切れる相手の球に当てると、その球の数字が「÷自分の数字」に縮む</b>(割り切れなければただ跳ね返るだけ)。
    1になった球は消える。20球打てるうちに、どれだけ消せるか。
  </div>

<script>
const W = 620, H = 380, R = 20, FRICTION = 0.985, MAX_SHOTS = 20;
const POOL = [2, 3, 4, 6, 8, 9, 12, 16, 18, 24, 27, 32, 36, 48, 54, 60];
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  const values = [...POOL].sort(() => Math.random() - 0.5).slice(0, 7);
  const balls = values.map((v, i) => ({
    x: 100 + (i % 4) * 130 + Math.random() * 20,
    y: 90 + Math.floor(i / 4) * 150 + Math.random() * 20,
    vx: 0, vy: 0, n: v,
  }));
  state = { running: true, balls, cleared: 0, score: 0, shotsLeft: MAX_SHOTS, selected: null, aiming: false, dragX: 0, dragY: 0 };
  updateHud();
  render();
}

function updateHud() {
  document.getElementById('cleared').textContent = state.cleared;
  document.getElementById('score').textContent = state.score;
  document.getElementById('shots').textContent = state.shotsLeft;
}

function allStopped() {
  return state.balls.every(b => Math.hypot(b.vx, b.vy) < 0.05);
}

const canvas = document.getElementById('game');
function posFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}
canvas.addEventListener('pointerdown', e => {
  if (!state.running || !allStopped() || state.shotsLeft <= 0) return;
  const p = posFromEvent(e);
  const hit = state.balls.find(b => Math.hypot(b.x - p.x, b.y - p.y) < R + 4);
  if (hit) { state.selected = hit; state.aiming = true; state.dragX = p.x; state.dragY = p.y; }
});
canvas.addEventListener('pointermove', e => {
  if (!state.aiming) return;
  const p = posFromEvent(e);
  state.dragX = p.x; state.dragY = p.y;
});
canvas.addEventListener('pointerup', () => {
  if (!state.aiming || !state.selected) { state.aiming = false; return; }
  const b = state.selected;
  const dx = b.x - state.dragX, dy = b.y - state.dragY;
  const dist = Math.min(140, Math.hypot(dx, dy));
  if (dist > 10) {
    const power = dist * 0.11;
    const ang = Math.atan2(dy, dx);
    b.vx = Math.cos(ang) * power;
    b.vy = Math.sin(ang) * power;
    state.shotsLeft--;
    updateHud();
  }
  state.aiming = false; state.selected = null;
});

function resolveDivision(a, b) {
  // aがbを割り切るなら b.n を縮める(同じ数字同士なら1になって消える)
  if (b.n % a.n === 0) { b.n = b.n / a.n; return b; }
  if (a.n % b.n === 0) { a.n = a.n / b.n; return a; }
  return null;
}

function update() {
  if (!state.running) return;

  for (const b of state.balls) {
    b.x += b.vx; b.y += b.vy;
    b.vx *= FRICTION; b.vy *= FRICTION;
    if (Math.hypot(b.vx, b.vy) < 0.04) { b.vx = 0; b.vy = 0; }
    if (b.x < R) { b.x = R; b.vx *= -0.9; }
    if (b.x > W - R) { b.x = W - R; b.vx *= -0.9; }
    if (b.y < R) { b.y = R; b.vy *= -0.9; }
    if (b.y > H - R) { b.y = H - R; b.vy *= -0.9; }
  }

  for (let i = 0; i < state.balls.length; i++) {
    for (let j = i + 1; j < state.balls.length; j++) {
      const a = state.balls[i], b = state.balls[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d < R * 2 && d > 0) {
        const overlap = (R * 2 - d) / 2;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * overlap; a.y -= ny * overlap;
        b.x += nx * overlap; b.y += ny * overlap;
        const shrunk = resolveDivision(a, b);
        const tvx = a.vx, tvy = a.vy;
        a.vx = b.vx * 0.9; a.vy = b.vy * 0.9;
        b.vx = tvx * 0.9; b.vy = tvy * 0.9;
        if (shrunk) { state.score += 10; updateHud(); }
      }
    }
  }

  const before = state.balls.length;
  state.balls = state.balls.filter(b => {
    if (b.n === 1) { state.cleared++; state.score += 50; return false; }
    return true;
  });
  if (state.balls.length !== before) updateHud();

  if (state.balls.length === 0) return clearGame();
  if (state.shotsLeft <= 0 && allStopped()) return endGame();

  render();
}

function clearGame() {
  state.running = false;
  state.score += state.shotsLeft * 20;
  document.getElementById('msgTitle').textContent = '🎉 全部消した！';
  document.getElementById('msgText').textContent = `残り球数ボーナス込み\nスコア: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  updateHud();
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function endGame() {
  state.running = false;
  document.getElementById('msgTitle').textContent = '🎱 球切れ';
  document.getElementById('msgText').textContent = `消した球: ${state.cleared}個\nスコア: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function render() {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  if (state.aiming && state.selected) {
    ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 3; ctx.setLineDash([6, 6]);
    ctx.beginPath(); ctx.moveTo(state.selected.x, state.selected.y); ctx.lineTo(state.dragX, state.dragY); ctx.stroke();
    ctx.setLineDash([]);
  }

  state.balls.forEach(b => {
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, Math.PI * 2);
    ctx.fillStyle = b === state.selected ? '#ffd040' : '#f0ecec';
    ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#222'; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.n, b.x, b.y);
  });
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
}

setInterval(update, 1000 / 30);
window.gcGiveUp = () => { if (state.running) endGame(); };
resetGame();
</script>
</body>
</html>
