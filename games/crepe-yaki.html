<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>クレープ屋さん</title>
<style>
  body { margin:0; background:#3a2a1a; color:#fff5e8; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:520px; max-width:100%; margin-bottom:8px; font-size:14px; gap:10px; flex-wrap:wrap; }
  #wrap { position:relative; }
  canvas { background:#8a5a2a; border:3px solid #2a1a0a; border-radius:10px; display:block; touch-action:none; }
  #order { text-align:center; font-size:14px; margin-top:8px; min-height:20px; }
  #toppings { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:10px; max-width:520px; }
  #toppings button { font-size:22px; padding:8px 10px; border-radius:10px; border:2px solid #6a4a2a; background:#fff5e8; cursor:pointer; }
  #toppings button.on { background:#f0c020; border-color:#a07010; }
  #serveBtn { margin-top:12px; font-size:16px; padding:12px 32px; border-radius:14px; border:none; background:#e08030; color:#fff; cursor:pointer; font-weight:bold; }
  #serveBtn:disabled { opacity:.4; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:520px; font-size:13px; color:#e8d0b8; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🥞 クレープ屋さん</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>提供数: <span id="served">0</span></div>
    <div>残り時間: <span id="time">90</span>秒</div>
  </div>
  <div id="wrap">
    <canvas id="game" width="520" height="340"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="order"></div>
  <div id="toppings"></div>
  <button id="serveBtn" disabled>🌯 巻いて提供する</button>
  <div id="help">
    生地フェーズ: 中心から出る光る点をなぞるように、マウス/指でドラッグして円を描こう。<b>真円に近いほど</b>きれいに広がる。
    1周したら具材フェーズへ。注文と同じ具材をタップして選び、「巻いて提供する」で次のお客さんへ。90秒で何人さばけるか。
  </div>

<script>
const W = 520, H = 340, CX = W / 2, CY = 150, RADIUS = 85;
const LOOP_FRAMES = 90, TIME_LIMIT = 90 * 30;
const INGREDIENTS = ['🍌', '🍫', '🍦', '🍓', '🧇', '🥜', '🍯', '🫐'];
let state = {};

function newOrder() {
  const pool = [...INGREDIENTS].sort(() => Math.random() - 0.5);
  return pool.slice(0, 2 + (Math.random() < 0.4 ? 1 : 0));
}

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    score: 0, served: 0, timeLeft: TIME_LIMIT, running: true,
    phase: 'spread', angle: 0, tracing: false, errSum: 0, errCount: 0,
    order: newOrder(), selected: new Set(),
  };
  renderToppings();
  updateHud();
  render();
}

function updateHud() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('served').textContent = state.served;
  document.getElementById('time').textContent = Math.ceil(state.timeLeft / 30);
  document.getElementById('order').textContent = state.phase === 'topping'
    ? '注文: ' + state.order.join(' ') : '生地を円く広げよう';
}

function renderToppings() {
  const box = document.getElementById('toppings');
  box.innerHTML = '';
  INGREDIENTS.forEach(ing => {
    const b = document.createElement('button');
    b.textContent = ing;
    b.onclick = () => {
      if (state.phase !== 'topping') return;
      if (state.selected.has(ing)) state.selected.delete(ing); else state.selected.add(ing);
      renderToppings();
    };
    if (state.selected && state.selected.has(ing)) b.classList.add('on');
    box.appendChild(b);
  });
  document.getElementById('serveBtn').disabled = state.phase !== 'topping';
}
document.getElementById('serveBtn').onclick = () => {
  if (state.phase !== 'topping') return;
  const orderSet = new Set(state.order);
  let correct = 0, wrong = 0;
  state.selected.forEach(ing => { if (orderSet.has(ing)) correct++; else wrong++; });
  const missing = state.order.length - correct;
  const toppingScore = Math.max(0, 100 - missing * 35 - wrong * 25);
  const orderScore = Math.round((state.spreadScore + toppingScore) / 2);
  state.score += orderScore;
  state.served++;
  state.flash = `できあがり！ +${orderScore}`; state.flashTimer = 30;
  state.order = newOrder();
  state.selected = new Set();
  state.phase = 'spread'; state.angle = 0; state.tracing = false; state.errSum = 0; state.errCount = 0;
  renderToppings();
  updateHud();
};

const canvas = document.getElementById('game');
function posFromEvent(e) {
  const rect = canvas.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * (W / rect.width), y: (e.clientY - rect.top) * (H / rect.height) };
}
let pointer = { x: CX, y: CY };
canvas.addEventListener('pointerdown', e => {
  if (state.phase !== 'spread') return;
  pointer = posFromEvent(e);
  if (Math.hypot(pointer.x - (CX + RADIUS), pointer.y - CY) < 40) state.tracing = true;
});
canvas.addEventListener('pointermove', e => { pointer = posFromEvent(e); });
canvas.addEventListener('pointerup', () => { state.tracing = false; });
canvas.addEventListener('pointercancel', () => { state.tracing = false; });

function update() {
  if (!state.running) return;
  state.timeLeft--;
  if (state.flashTimer > 0) state.flashTimer--; else state.flash = null;
  if (state.timeLeft <= 0) { state.timeLeft = 0; updateHud(); return endGame(); }

  if (state.phase === 'spread' && state.tracing) {
    const tx = CX + Math.cos(state.angle) * RADIUS, ty = CY + Math.sin(state.angle) * RADIUS;
    const err = Math.hypot(pointer.x - tx, pointer.y - ty);
    state.errSum += Math.min(err, 60); state.errCount++;
    state.angle += (Math.PI * 2) / LOOP_FRAMES;
    if (state.angle >= Math.PI * 2) {
      const avgErr = state.errCount ? state.errSum / state.errCount : 60;
      state.spreadScore = Math.max(0, Math.round(100 - avgErr * 2));
      state.phase = 'topping'; state.tracing = false;
      state.flash = state.spreadScore >= 80 ? '✨ きれいな円！' : state.spreadScore >= 50 ? '生地できた' : 'ちょっと歪んだ…';
      state.flashTimer = 30;
      renderToppings();
    }
  }

  updateHud();
  render();
}

function endGame() {
  state.running = false;
  document.getElementById('msgTitle').textContent = '⏰ 閉店時間！';
  document.getElementById('msgText').textContent = `提供数: ${state.served}人\nスコア: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function render() {
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#6a4218';
  ctx.beginPath(); ctx.arc(CX, CY, RADIUS + 25, 0, Math.PI * 2); ctx.fill();

  if (state.phase === 'spread') {
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.setLineDash([4, 6]); ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(CX, CY, RADIUS, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);

    const tx = CX + Math.cos(state.angle) * RADIUS, ty = CY + Math.sin(state.angle) * RADIUS;
    ctx.fillStyle = '#ffe080';
    ctx.beginPath(); ctx.arc(tx, ty, 10, 0, Math.PI * 2); ctx.fill();

    if (state.tracing) {
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(pointer.x, pointer.y, 7, 0, Math.PI * 2); ctx.fill();
    } else if (state.angle === 0) {
      ctx.font = '13px sans-serif'; ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
      ctx.fillText('光る点から、なぞり始めよう', CX, CY + RADIUS + 45);
      ctx.textAlign = 'left';
    }
  } else {
    const r = RADIUS * (0.6 + 0.4 * (state.spreadScore || 50) / 100);
    ctx.fillStyle = '#f0d8a0';
    ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.fill();
    ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
    const n = state.selected.size || 0;
    [...state.selected].forEach((ing, i) => {
      const a = (i / Math.max(1, n)) * Math.PI * 2;
      ctx.fillText(ing, CX + Math.cos(a) * r * 0.5, CY + Math.sin(a) * r * 0.5 + 10);
    });
    ctx.textAlign = 'left';
  }

  if (state.flash) {
    ctx.font = 'bold 18px sans-serif'; ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.fillText(state.flash, W / 2, 26); ctx.textAlign = 'left';
  }
}

setInterval(update, 1000 / 30);
window.gcGiveUp = () => { if (state.running) endGame(); };
resetGame();
</script>
</body>
</html>
