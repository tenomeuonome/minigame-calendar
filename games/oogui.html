<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大食いチャレンジ</title>
<style>
  body {
    margin: 0;
    background: #fff0e0;
    color: #4a3322;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 8px 0; }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 800px;
    max-width: 100%;
    margin-bottom: 6px;
    font-size: 14px;
  }
  #fullBar {
    width: 800px; max-width: 100%;
    height: 22px;
    background: #fff;
    border: 2px solid #c98a3f;
    border-radius: 11px;
    overflow: hidden;
    margin-bottom: 10px;
    position: relative;
  }
  #fullFill {
    height: 100%; width: 0%;
    background: linear-gradient(90deg,#8fd14f,#e0c23f);
    transition: width 0.15s linear;
  }
  #fullFill.warn { background: linear-gradient(90deg,#e0a33a,#ff8a4d); }
  #fullFill.danger { background: linear-gradient(90deg,#ff6b4d,#d9342b); }
  #fullLabel { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: bold; color: #4a3322; }
  #wrap { position: relative; width: 800px; max-width: 100%; }
  #table {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 14px;
    background: #d9a35a;
    border-radius: 14px;
    padding: 20px;
  }
  .slot {
    background: #fffaf0;
    border: 2px solid #c98a3f;
    border-radius: 12px;
    height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    user-select: none;
  }
  .slot.empty { opacity: 0.3; cursor: default; }
  .slot .emoji { font-size: 34px; }
  .slot .val { font-size: 12px; color: #8a6a3a; margin-top: 2px; }
  #msg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.75); border-radius: 14px; text-align: center; color: #fff;
  }
  #msg h2 { font-size: 26px; margin-bottom: 8px; }
  #msg button { padding: 8px 20px; font-size: 15px; border-radius: 6px; border: none; background: #d9742a; color: #fff; cursor: pointer; margin-top: 8px; }
  #help { max-width: 800px; font-size: 13px; color: #8a6a4a; margin-top: 14px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
  <h1>🍽️ 大食いチャレンジ</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>残り時間: <span id="time">60</span>秒</div>
  </div>
  <div id="fullBar"><div id="fullFill"></div><div id="fullLabel">満腹度 0%</div></div>
  <div id="wrap">
    <div id="table"></div>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    料理をタップ/クリックして食べる。料理ごとに満腹度の増え方が違う(重い料理ほどたくさん増える)。<br>
    時間が経つと消化で満腹度が減っていく。満腹度が100%を超えると吐いてしまってゲームオーバー。
  </div>

<script>
const FOODS = [
  { emoji: '🍙', name: 'おにぎり', fullness: 10 },
  { emoji: '🥗', name: 'サラダ',   fullness: 7 },
  { emoji: '🍩', name: 'ドーナツ', fullness: 9 },
  { emoji: '🍣', name: '寿司',     fullness: 14 },
  { emoji: '🥟', name: '餃子',     fullness: 16 },
  { emoji: '🍉', name: 'スイカ',   fullness: 12 },
  { emoji: '🍗', name: 'チキン',   fullness: 21 },
  { emoji: '🍰', name: 'ケーキ',   fullness: 19 },
  { emoji: '🍜', name: 'ラーメン', fullness: 33 },
  { emoji: '🍖', name: 'ステーキ', fullness: 38 },
];
const MAX_FULL = 100;
const DIGEST_RATE = 2.6; // 1秒あたりの満腹度の減り
const SLOT_COUNT = 8;
const RESPAWN_FRAMES = 40;

let state = {};

function randomFood() { return FOODS[Math.floor(Math.random() * FOODS.length)]; }

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    fullness: 0,
    score: 0,
    timeLeft: 60,
    running: true,
    slots: Array.from({ length: SLOT_COUNT }, () => ({ food: randomFood(), respawnTimer: 0 })),
  };
  renderSlots();
  render();
}

function eat(i) {
  if (!state.running) return;
  const slot = state.slots[i];
  if (!slot.food) return;
  const f = slot.food;
  if (state.fullness + f.fullness > MAX_FULL) {
    state.fullness = MAX_FULL;
    render();
    return endGame(false, f);
  }
  state.fullness += f.fullness;
  state.score += f.fullness;
  slot.food = null;
  slot.respawnTimer = RESPAWN_FRAMES;
  renderSlots();
  render();
}

function renderSlots() {
  const table = document.getElementById('table');
  table.innerHTML = '';
  state.slots.forEach((slot, i) => {
    const el = document.createElement('div');
    el.className = 'slot' + (slot.food ? '' : ' empty');
    if (slot.food) {
      el.innerHTML = `<div class="emoji">${slot.food.emoji}</div><div class="val">${slot.food.name} +${slot.food.fullness}</div>`;
      el.onclick = () => eat(i);
    } else {
      el.innerHTML = `<div class="emoji">…</div>`;
    }
    table.appendChild(el);
  });
}

function update() {
  if (!state.running) return;

  state.fullness = Math.max(0, state.fullness - DIGEST_RATE / 60);

  let changed = false;
  state.slots.forEach(slot => {
    if (!slot.food) {
      slot.respawnTimer--;
      if (slot.respawnTimer <= 0) { slot.food = randomFood(); changed = true; }
    }
  });
  if (changed) renderSlots();

  state.timeLeft -= 1/60;
  if (state.timeLeft <= 0) return endGame(true);
  render();
}

function render() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));
  const pct = Math.min(100, state.fullness);
  const fill = document.getElementById('fullFill');
  fill.style.width = pct + '%';
  fill.className = pct >= 85 ? 'danger' : pct >= 60 ? 'warn' : '';
  document.getElementById('fullLabel').textContent = `満腹度 ${Math.round(pct)}%`;
}

function endGame(timeUp, lastFood, title) {
  state.running = false;
  if (!state.submitted) { state.submitted = true; const s = state.score; setTimeout(() => window.GC && GC.submitScore(s), 1200); }
  if (title) {
    document.getElementById('msgTitle').textContent = title;
    document.getElementById('msgText').textContent = `スコア: ${state.score}点`;
  } else if (timeUp) {
    document.getElementById('msgTitle').textContent = '🏆 タイムアップ';
    document.getElementById('msgText').textContent = `スコア: ${state.score}点\nまだ食べられそう！`;
  } else {
    document.getElementById('msgTitle').textContent = '🤮 限界を超えた…';
    document.getElementById('msgText').textContent = `${lastFood.name}で満腹度オーバー。\nスコア: ${state.score}点`;
  }
  document.getElementById('msg').style.display = 'flex';
}

function loop() { update(); requestAnimationFrame(loop); }

resetGame();
loop();
window.gcGiveUp = () => { if (state.running) endGame(false, null, '🏳️ ここで終了'); };
</script>
</body>
</html>
