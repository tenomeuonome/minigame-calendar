<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>リフティングチャレンジ</title>
<style>
  body { margin:0; background:#1a4a2a; color:#eafaf0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:480px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; }
  canvas { background:#3a7a4a; border:3px solid #15351f; border-radius:10px; display:block; touch-action:none; }
  #ctl { display:flex; justify-content:center; gap:10px; margin-top:12px; }
  #ctl button { font-size:16px; padding:14px 26px; border-radius:12px; border:none; background:#2a6a3a; color:#fff; cursor:pointer; font-weight:bold; }
  #kickBtn { background:#d87a2a; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:480px; font-size:13px; color:#cdeed9; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>⚽ リフティングチャレンジ</h1>
  <div id="hud">
    <div>回数: <span id="count">0</span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="480" height="380"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="ctl">
    <button id="btnLeft">◀ 左</button>
    <button id="kickBtn">⚡ キック</button>
    <button id="btnRight">右 ▶</button>
  </div>
  <div id="help">
    左右(矢印キーか左右ボタン)で移動してボールの真下に入り、ボールが膝の高さに来たタイミングで「キック」(スペースキーも可)。
    リフティングが続くほどボールの跳ね方が少しずつ不安定になる。地面に落としたら終了、何回続けられるか。
  </div>

<script>
const W = 480, H = 380, GROUND_Y = 340;
const GRAVITY = 0.28;
let state = {};
let input = { left: false, right: false };

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    running: true, count: 0, px: W / 2, kickFlash: 0,
    bx: W / 2, by: 120, bvx: 0, bvy: 0,
  };
  updateHud();
  render();
}

function updateHud() { document.getElementById('count').textContent = state.count; }

document.getElementById('btnLeft').addEventListener('pointerdown', e => { e.preventDefault(); input.left = true; });
document.getElementById('btnLeft').addEventListener('pointerup', () => input.left = false);
document.getElementById('btnLeft').addEventListener('pointerleave', () => input.left = false);
document.getElementById('btnRight').addEventListener('pointerdown', e => { e.preventDefault(); input.right = true; });
document.getElementById('btnRight').addEventListener('pointerup', () => input.right = false);
document.getElementById('btnRight').addEventListener('pointerleave', () => input.right = false);
document.getElementById('kickBtn').onclick = tryKick;
document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowLeft') input.left = true;
  if (e.key === 'ArrowRight') input.right = true;
  if (e.key === ' ') tryKick();
});
document.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft') input.left = false;
  if (e.key === 'ArrowRight') input.right = false;
});

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

function tryKick() {
  if (!state.running) return;
  const inRangeX = Math.abs(state.bx - state.px) < 34;
  const inRangeY = state.by > GROUND_Y - 80 && state.by < GROUND_Y - 10;
  if (inRangeX && inRangeY) {
    const drift = Math.min(4, 1.3 + state.count * 0.06);
    state.bvy = -8.6 - Math.random() * 0.8;
    state.bvx = (Math.random() - 0.5) * 2 * drift;
    state.count++;
    state.kickFlash = 8;
    updateHud();
  }
}

function update() {
  if (!state.running) return;
  if (input.left) state.px -= 4.5;
  if (input.right) state.px += 4.5;
  state.px = clamp(state.px, 20, W - 20);
  if (state.kickFlash > 0) state.kickFlash--;

  state.bvy += GRAVITY;
  state.bx += state.bvx;
  state.by += state.bvy;
  if (state.bx < 16 || state.bx > W - 16) { state.bvx *= -0.85; state.bx = clamp(state.bx, 16, W - 16); }

  if (state.by > GROUND_Y) return endGame();

  render();
}

function endGame() {
  state.running = false;
  document.getElementById('msgTitle').textContent = '⚽ 落としちゃった…';
  document.getElementById('msgText').textContent = `リフティング: ${state.count}回`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.count), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#2a5a2a'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([10, 8]);
  ctx.beginPath(); ctx.moveTo(0, GROUND_Y); ctx.lineTo(W, GROUND_Y); ctx.stroke(); ctx.setLineDash([]);

  const kicking = state.kickFlash > 0;
  ctx.strokeStyle = '#ffe0b0'; ctx.lineWidth = 6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(state.px, GROUND_Y); ctx.lineTo(state.px - 8, GROUND_Y - 30); ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(state.px, GROUND_Y);
  if (kicking) ctx.lineTo(state.px + 22, GROUND_Y - 22);
  else ctx.lineTo(state.px + 8, GROUND_Y - 30);
  ctx.stroke();
  ctx.fillStyle = '#ffe0b0';
  ctx.beginPath(); ctx.arc(state.px, GROUND_Y - 42, 12, 0, Math.PI * 2); ctx.fill();

  ctx.font = '30px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('⚽', state.bx, state.by + 10);
  ctx.textAlign = 'left';
}

setInterval(update, 1000 / 30);
window.gcGiveUp = () => { if (state.running) endGame(); };
resetGame();
</script>
</body>
</html>
