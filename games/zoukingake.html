<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雑巾がけ競争</title>
<style>
  body { margin:0; background:#3a2a1a; color:#f5e9d6; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:800px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; }
  canvas { background:#8a6a3a; border:3px solid #4a3318; border-radius:10px; display:block; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.78); border-radius:10px; text-align:center; }
  #msg h2 { font-size:26px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#c0a060; color:#3a2a1a; cursor:pointer; font-weight:bold; }
  #help { max-width:800px; font-size:13px; color:#d8c3a0; margin-top:10px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🧹 お寺の雑巾がけ競争</h1>
  <div id="hud">
    <div>あなた: <span id="playerDist">0</span>m</div>
    <div>残り時間: <span id="time">15</span>秒</div>
    <div>1位の小僧: <span id="rivalDist">0</span>m</div>
  </div>
  <div id="wrap">
    <canvas id="game" width="800" height="200"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    左右のキー(←→ または A/D)を<b>交互に連打</b>して雑巾がけで前進。長い廊下を、ほかの小僧2人より速く走りきろう。
  </div>

<script>
const COURSE_LEN = 700; // m換算
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    playerDist: 0, playerSpeed: 0,
    rivals: [ { dist: 0, speed: 0 }, { dist: 0, speed: 0 } ],
    timeLeft: 15, lastKey: null, running: true, finished: false,
  };
}

document.addEventListener('keydown', e => {
  if (!state.running || state.finished) return;
  const key = (e.key === 'ArrowLeft' || e.key === 'a') ? 'L' : (e.key === 'ArrowRight' || e.key === 'd') ? 'R' : null;
  if (!key) return;
  e.preventDefault();
  if (key !== state.lastKey) {
    state.playerSpeed = Math.min(5.5, state.playerSpeed + 1.1);
    state.lastKey = key;
  }
});

function update() {
  if (!state.running) return;

  state.playerSpeed *= 0.93; // 連打をやめると減速
  state.playerDist = Math.min(COURSE_LEN, state.playerDist + state.playerSpeed * 0.3);

  state.rivals.forEach((r, i) => {
    r.speed = 2.2 + Math.sin(state.timeLeft * 2 + i) * 0.6 + i * 0.3;
    r.dist = Math.min(COURSE_LEN, r.dist + r.speed * 0.3);
  });

  document.getElementById('playerDist').textContent = Math.round(state.playerDist);
  document.getElementById('rivalDist').textContent = Math.round(Math.max(...state.rivals.map(r => r.dist)));

  if (state.playerDist >= COURSE_LEN) return endGame(true);

  state.timeLeft -= 1/60;
  document.getElementById('time').textContent = Math.max(0, state.timeLeft.toFixed(1));
  if (state.timeLeft <= 0) return endGame(false);
  render();
}

function endGame(finished, title) {
  state.running = false;
  state.finished = true;
  const rank = 1 + state.rivals.filter(r => r.dist > state.playerDist).length;
  const score = finished ? Math.round(2000 - (15 - state.timeLeft) * 60) : Math.round(state.playerDist);
  document.getElementById('msgTitle').textContent = title || (finished ? (rank === 1 ? '🏆 1位でゴール！' : `${rank}位でゴール`) : '⏱ 時間切れ');
  document.getElementById('msgText').textContent = finished
    ? `タイム: ${(15 - state.timeLeft).toFixed(1)}秒\nスコア: ${score}`
    : `進んだ距離: ${Math.round(state.playerDist)}m / ${COURSE_LEN}m\nスコア: ${score}`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(Math.max(0, score)), 1200);
  render();
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  const trackX0 = 30, trackX1 = W - 30;
  const toPx = (d) => trackX0 + (trackX1 - trackX0) * (d / COURSE_LEN);

  // コース
  ['#a0794a', '#8a6a3a', '#a0794a'].forEach((c, i) => {
    ctx.fillStyle = c;
    ctx.fillRect(0, 30 + i * 55, W, 50);
  });

  // ゴール線
  ctx.fillStyle = '#fff';
  ctx.fillRect(trackX1 - 2, 20, 4, H - 40);

  ctx.font = '30px sans-serif';
  ctx.fillText('🧹', toPx(state.playerDist) - 15, 70);
  state.rivals.forEach((r, i) => ctx.fillText('🧹', toPx(r.dist) - 15, 70 + (i + 1) * 55));

  ctx.font = '13px sans-serif';
  ctx.fillStyle = '#fff';
  ctx.fillText('あなた', 4, 90);
  ctx.fillText('小僧A', 4, 145);
  ctx.fillText('小僧B', 4, 200);
}

function loop() { update(); requestAnimationFrame(loop); }
resetGame();
loop();
window.gcGiveUp = () => { if (state.running) endGame(false, '🏳️ ここで終了'); };
</script>
</body>
</html>
