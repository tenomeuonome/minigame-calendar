<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台風でいよう</title>
<style>
  body { margin:0; background:#0a1a2a; color:#eaf4ff; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:800px; max-width:100%; margin-bottom:6px; font-size:14px; }
  #powerBar { width:800px; max-width:100%; height:16px; background:#06121f; border:2px solid #2a6a9a; border-radius:8px; overflow:hidden; margin-bottom:8px; }
  #powerFill { height:100%; width:30%; background:linear-gradient(90deg,#4ad1ff,#ff6b4d); transition:width 0.1s linear; }
  #wrap { position:relative; }
  canvas { background:#0e2740; border:3px solid #1a4a6a; border-radius:10px; display:block; touch-action:none; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.78); border-radius:10px; text-align:center; }
  #msg h2 { font-size:26px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#4ad1ff; color:#06121f; cursor:pointer; font-weight:bold; }
  #help { max-width:800px; font-size:13px; color:#a9d4e2; margin-top:10px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🌀 台風でいよう</h1>
  <div id="hud">
    <div>生存時間: <span id="time">0.0</span>秒</div>
    <div>最大勢力: <span id="maxPower">30</span></div>
    <div id="status">🌊 海上</div>
  </div>
  <div id="powerBar"><div id="powerFill"></div></div>
  <div id="wrap">
    <canvas id="game" width="800" height="460"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    マウス/指で台風の周りをぐるぐる円を描くと勢力(パワー)が上がる。何もしないと自然に弱まる。<br>
    陸地(緑)に入ると一気に弱まり、円を描いても効果が薄い。海に戻ってまた力を蓄えよう。パワーが0になると消滅。
  </div>

<script>
const W = 800, H = 460;
let state = {};
let landmass = [{ x: 560, y: 60, w: 240, h: 400 }]; // 右側が陸地

function isOverLand(x, y) {
  return landmass.some(l => x >= l.x && x <= l.x + l.w && y >= l.y && y <= l.y + l.h);
}

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    x: 200, y: 230, power: 30, maxPower: 30, elapsed: 0,
    drift: { vx: 0.25, vy: 0.08 },
    running: true,
    mouseAngleHistory: [],
    lastMouse: null,
    circleProgress: 0,
  };
}

function screenPos(e) {
  const canvas = document.getElementById('game');
  const rect = canvas.getBoundingClientRect();
  const cx = e.touches ? e.touches[0].clientX : e.clientX;
  const cy = e.touches ? e.touches[0].clientY : e.clientY;
  return { x: (cx - rect.left) * (W / rect.width), y: (cy - rect.top) * (H / rect.height) };
}

let pointerDown = false;
let prevAngle = null;
function handleMove(e) {
  if (!state.running) return;
  const p = screenPos(e);
  const dx = p.x - state.x, dy = p.y - state.y;
  const dist = Math.hypot(dx, dy);
  if (dist < 20 || dist > 140) { prevAngle = null; return; } // 台風から離れすぎ/近すぎは無効
  const angle = Math.atan2(dy, dx);
  if (prevAngle !== null) {
    let d = angle - prevAngle;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    state.circleProgress += d;
    if (Math.abs(state.circleProgress) >= Math.PI * 2) {
      const onLand = isOverLand(state.x, state.y);
      const gain = onLand ? 2 : 9;
      state.power = Math.min(999, state.power + gain);
      state.maxPower = Math.max(state.maxPower, state.power);
      document.getElementById('maxPower').textContent = Math.round(state.maxPower);
      state.circleProgress = 0;
    }
  }
  prevAngle = angle;
}

document.getElementById('game').addEventListener('mousemove', handleMove);
document.getElementById('game').addEventListener('touchmove', e => { e.preventDefault(); handleMove(e); }, { passive: false });
document.addEventListener('mouseleave', () => { prevAngle = null; });

function update() {
  if (!state.running) return;
  state.elapsed += 1/60;

  const onLand = isOverLand(state.x, state.y);
  // 自然減衰(常に少しずつ)。陸地だとさらに大きく減衰し、進路も止まる
  state.power -= onLand ? 0.55 : 0.08;

  if (!onLand) {
    state.x += state.drift.vx;
    state.y += state.drift.vy;
  }
  state.x = Math.max(20, Math.min(W - 20, state.x));
  state.y = Math.max(20, Math.min(H - 20, state.y));

  document.getElementById('status').textContent = onLand ? '🏝️ 上陸中(弱まる)' : '🌊 海上';
  document.getElementById('time').textContent = state.elapsed.toFixed(1);
  document.getElementById('powerFill').style.width = Math.min(100, state.power / 2) + '%';

  if (state.power <= 0) return endGame();
}

function endGame() {
  state.running = false;
  const score = Math.round(state.elapsed * 10 + state.maxPower);
  document.getElementById('msgTitle').textContent = '🌫️ 熱帯低気圧になって消滅';
  document.getElementById('msgText').textContent = `生存時間: ${state.elapsed.toFixed(1)}秒\n最大勢力: ${Math.round(state.maxPower)}\nスコア: ${score}`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(score), 1200);
}

function draw() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  // 海
  ctx.fillStyle = '#0e2740';
  ctx.fillRect(0, 0, W, H);
  // 陸地
  ctx.fillStyle = '#2f6b3a';
  landmass.forEach(l => ctx.fillRect(l.x, l.y, l.w, l.h));

  // 台風
  const r = 14 + Math.min(40, state.power / 8);
  ctx.save();
  ctx.translate(state.x, state.y);
  ctx.rotate(state.elapsed * 2);
  ctx.strokeStyle = 'rgba(255,255,255,0.7)';
  ctx.lineWidth = 4;
  for (let i = 0; i < 3; i++) {
    ctx.save();
    ctx.rotate((i / 3) * Math.PI * 2);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 1.3);
    ctx.stroke();
    ctx.restore();
  }
  ctx.fillStyle = 'rgba(255,255,255,0.9)';
  ctx.beginPath();
  ctx.arc(0, 0, 6, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

function loop() { update(); draw(); requestAnimationFrame(loop); }
resetGame();
loop();
</script>
</body>
</html>
