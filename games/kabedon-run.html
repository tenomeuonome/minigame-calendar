<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>壁ドン・リズム</title>
<style>
  body { margin:0; background:#2b2440; color:#f0ecff; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:640px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; width:640px; max-width:100%; }
  #wall { display:flex; gap:10px; background:#5a4a8a; border:3px solid #3a2f60; border-radius:12px; padding:18px; justify-content:center; }
  .slot {
    width: 120px; height: 150px;
    background: #4a3d70;
    border-radius: 10px;
    display: flex; align-items: flex-end; justify-content: center;
    font-size: 56px; padding-bottom: 6px;
    position: relative;
    cursor: pointer;
    border: 3px solid transparent;
  }
  .slot .num {
    position: absolute; top: 6px; left: 10px; font-size: 13px; color: #cabfe8; font-weight: bold;
  }
  .slot.flash-good { border-color: #6cc070; }
  .slot.flash-bad { border-color: #d9534f; }
  .patience-bar { height:10px; background:#1c1830; border-radius:5px; overflow:hidden; margin:14px auto 0; width:640px; max-width:100%; position:relative; }
  .patience-fill { height:100%; width:0%; background:#6cc070; }
  .zone-good { position:absolute; top:0; height:100%; background:rgba(255,210,74,0.35); }
  .zone-perfect { position:absolute; top:0; height:100%; background:rgba(255,210,74,0.8); }
  .marker { position:absolute; top:-4px; width:4px; height:18px; background:#fff; }
  #judgeToast { text-align:center; font-size:18px; font-weight:bold; height:26px; margin-top:8px; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:12px; text-align:center; }
  #msg h2 { font-size:26px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#ff7ab8; color:#fff; cursor:pointer; }
  #help { max-width:640px; font-size:13px; color:#cabfe8; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>💘 壁ドン・リズム</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>残り時間: <span id="time">45</span>秒</div>
    <div>コンボ: <span id="combo">0</span></div>
  </div>
  <div id="wrap">
    <div id="wall"></div>
    <div class="patience-bar" id="patienceBar">
      <div class="zone-good" id="zoneGood"></div>
      <div class="zone-perfect" id="zonePerfect"></div>
      <div class="marker" id="marker"></div>
    </div>
    <div id="judgeToast"></div>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    壁際に人が立っている(🧍)。<b>誰もいない場所</b>を選んで、マーカーが黄色いゾーンに入った瞬間に数字キー(1〜4)かタップで壁ドン！<br>
    人がいる場所を叩くと失敗。タイミングがズレても失敗。テンポに乗ってコンボを繋げよう。
  </div>

<script>
const SLOT_COUNT = 4;
const ZONE_CENTER = 75;
const PERFECT_WIDTH = 6;
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    score: 0, combo: 0, timeLeft: 45,
    t: 0, speed: 0.045, occupied: [], judged: false,
    running: true,
  };
  nextRound();
  layoutZones();
}

function layoutZones() {
  const barW = document.getElementById('patienceBar').offsetWidth || 640;
  const toPx = (pct) => (barW - 40) * (pct / 100) + 20;
  const goodEl = document.getElementById('zoneGood');
  const perfEl = document.getElementById('zonePerfect');
  goodEl.style.left = toPx(ZONE_CENTER - 16) + 'px';
  goodEl.style.width = (toPx(ZONE_CENTER + 16) - toPx(ZONE_CENTER - 16)) + 'px';
  perfEl.style.left = toPx(ZONE_CENTER - PERFECT_WIDTH) + 'px';
  perfEl.style.width = (toPx(ZONE_CENTER + PERFECT_WIDTH) - toPx(ZONE_CENTER - PERFECT_WIDTH)) + 'px';
  state._toPx = toPx;
}

function nextRound() {
  // 難易度(占有数)はスコアに応じて増える
  const occCount = Math.min(SLOT_COUNT - 1, 1 + Math.floor(state.score / 150));
  const idxs = [...Array(SLOT_COUNT).keys()];
  for (let i = idxs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [idxs[i], idxs[j]] = [idxs[j], idxs[i]];
  }
  state.occupied = idxs.slice(0, occCount);
  state.judged = false;
  state.t = 0;
  renderWall();
}

function renderWall() {
  const wall = document.getElementById('wall');
  wall.innerHTML = '';
  for (let i = 0; i < SLOT_COUNT; i++) {
    const el = document.createElement('div');
    el.className = 'slot';
    el.id = 'slot-' + i;
    const occupied = state.occupied.includes(i);
    el.innerHTML = `<span class="num">${i + 1}</span>` + (occupied ? '🧍' : '');
    el.onclick = () => judge(i);
    wall.appendChild(el);
  }
}

document.addEventListener('keydown', e => {
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= SLOT_COUNT) judge(n - 1);
});

function flashSlot(i, good) {
  const el = document.getElementById('slot-' + i);
  if (!el) return;
  el.classList.add(good ? 'flash-good' : 'flash-bad');
  setTimeout(() => el.classList.remove('flash-good', 'flash-bad'), 250);
}

function toast(text, color) {
  const el = document.getElementById('judgeToast');
  el.textContent = text;
  el.style.color = color;
}

function markerPos() { return 50 + 50 * Math.sin(state.t); }

function judge(slotIndex) {
  if (!state.running || state.judged) return;
  state.judged = true;

  if (state.occupied.includes(slotIndex)) {
    flashSlot(slotIndex, false);
    toast('ドンッ…人がいた！', '#e74c3c');
    state.combo = 0;
    document.getElementById('combo').textContent = state.combo;
    setTimeout(nextRound, 500);
    return;
  }

  const pos = markerPos();
  const diff = Math.abs(pos - ZONE_CENTER);
  let result, points;
  if (diff <= PERFECT_WIDTH) { result = 'PERFECT！'; points = 20; }
  else if (diff <= 16) { result = 'GOOD'; points = 10; }
  else { result = 'MISS(タイミングずれ)'; points = 0; }

  if (points > 0) {
    flashSlot(slotIndex, true);
    state.combo++;
    state.score += Math.round(points * (1 + state.combo * 0.03));
  } else {
    flashSlot(slotIndex, false);
    state.combo = 0;
  }
  toast(result, points > 0 ? (result.startsWith('PERFECT') ? '#ffd24a' : '#8fd14f') : '#e74c3c');
  document.getElementById('score').textContent = state.score;
  document.getElementById('combo').textContent = state.combo;
  setTimeout(nextRound, 400);
}

function update() {
  if (!state.running) return;
  state.t += state.speed;
  state.speed = Math.min(0.1, 0.045 + state.score / 6000);

  if (!state.judged && markerPos() < 2 && state.t > 3) {
    // マーカーが一周回っても押さなかった場合はタイムアウト扱い
    state.judged = true;
    state.combo = 0;
    toast('反応なし…', '#e74c3c');
    document.getElementById('combo').textContent = 0;
    setTimeout(nextRound, 300);
  }

  const marker = document.getElementById('marker');
  if (state._toPx) marker.style.left = (state._toPx(markerPos()) - 2) + 'px';

  state.timeLeft -= 1/60;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));
  if (state.timeLeft <= 0) endGame();
}

function endGame(title) {
  state.running = false;
  document.getElementById('msgTitle').textContent = title || '💘 おつかれさま';
  document.getElementById('msgText').textContent = `スコア: ${state.score}点`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

window.addEventListener('resize', layoutZones);
function loop() { update(); requestAnimationFrame(loop); }
resetGame();
loop();
window.gcGiveUp = () => { if (state.running) endGame('🏳️ ここで終了'); };
</script>
</body>
</html>
