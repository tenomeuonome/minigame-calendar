<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>授業中のこっそりタイム</title>
<style>
  body {
    margin: 0;
    background: #e8f0f5;
    color: #30414f;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 8px 0; }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 800px;
    max-width: 100%;
    margin-bottom: 8px;
    font-size: 14px;
  }
  #wrap { position: relative; }
  canvas { background: #fdf8ec; border: 3px solid #c9b896; border-radius: 10px; display: block; }
  #actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 16px;
    width: 800px;
    max-width: 100%;
  }
  .actionBtn {
    flex: 1;
    font-size: 15px;
    padding: 14px 10px;
    border-radius: 10px;
    border: 2px solid #c9b896;
    background: #fff;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .actionBtn:disabled { opacity: 0.5; cursor: default; }
  .actionBtn .progress {
    position: absolute; left: 0; bottom: 0; height: 4px; background: #6cb06c; width: 0%;
  }
  #msg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.75); border-radius: 10px; text-align: center; color: #fff;
  }
  #msg h2 { font-size: 26px; margin-bottom: 8px; }
  #msg button { padding: 8px 20px; font-size: 15px; border-radius: 6px; border: none; background: #4a90c9; color: #fff; cursor: pointer; margin-top: 8px; }
  #help { max-width: 800px; font-size: 13px; color: #6b7f8c; margin-top: 14px; line-height: 1.7; text-align: center; }
  .strike { color: #d9534f; font-weight: bold; }
</style>
</head>
<body>
  <h1>🏫 授業中のこっそりタイム</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>残り時間: <span id="time">60</span>秒</div>
    <div class="strike">警告: <span id="strikes">0</span> / 3</div>
  </div>
  <div id="wrap">
    <canvas id="game" width="800" height="300"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="actions">
    <button class="actionBtn" id="btn-bento" onclick="startAction('bento')">🍙 早弁<div class="progress" id="prog-bento"></div></button>
    <button class="actionBtn" id="btn-letter" onclick="startAction('letter')">✉️ 手紙を投げる<div class="progress" id="prog-letter"></div></button>
    <button class="actionBtn" id="btn-manga" onclick="startAction('manga')">📖 漫画を読む<div class="progress" id="prog-manga"></div></button>
  </div>
  <div id="help">
    先生が黒板を向いている間だけボタンを押せる。先生がこっちを向く前に「チラッ」と予兆が出るので、そこで様子を見よう。<br>
    行動中に見つかると警告+1。警告3回でゲームオーバー。
  </div>

<script>
const ACTIONS = {
  bento:  { label: '🍙', duration: 90,  score: 5 },
  letter: { label: '✉️', duration: 55,  score: 8 },
  manga:  { label: '📖', duration: 150, score: 15 },
};

let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    teacher: { mode: 'board', timer: 90, telegraph: false }, // mode: board(安全) / telegraph(予兆) / watch(危険)
    current: null, // { kind, elapsed }
    score: 0,
    strikes: 0,
    timeLeft: 60,
    running: true,
  };
  updateButtons();
}

function startAction(kind) {
  if (!state.running || state.current) return;
  state.current = { kind, elapsed: 0 };
  updateButtons();
}

function updateButtons() {
  ['bento', 'letter', 'manga'].forEach(k => {
    document.getElementById('btn-' + k).disabled = !!state.current;
  });
}

function scheduleNextTeacherSwitch() {
  const t = state.teacher;
  if (t.mode === 'board') {
    t.timer = 60 + Math.random() * 90; // そのうち様子を見る予兆が来る
  } else if (t.mode === 'telegraph') {
    t.timer = 35; // 予兆から実際に向くまでの猶予
  } else {
    t.timer = 70 + Math.random() * 70; // こっちを向いている時間
  }
}
function updateTeacher() {
  const t = state.teacher;
  t.timer--;
  if (t.timer > 0) return;
  if (t.mode === 'board') { t.mode = 'telegraph'; scheduleNextTeacherSwitch(); return; }
  if (t.mode === 'telegraph') {
    t.mode = 'watch';
    scheduleNextTeacherSwitch();
    // このタイミングで何か行動中なら即アウト
    if (state.current) catchPlayer();
    return;
  }
  t.mode = 'board';
  scheduleNextTeacherSwitch();
}

function catchPlayer() {
  state.strikes++;
  state.current = null;
  updateButtons();
  if (state.strikes >= 3) endGame(false);
}

function update() {
  if (!state.running) return;
  updateTeacher();

  if (state.current) {
    state.current.elapsed++;
    const def = ACTIONS[state.current.kind];
    const pct = Math.min(100, (state.current.elapsed / def.duration) * 100);
    document.getElementById('prog-' + state.current.kind).style.width = pct + '%';
    if (state.teacher.mode === 'watch') {
      catchPlayer();
    } else if (state.current.elapsed >= def.duration) {
      state.score += def.score;
      document.getElementById('prog-' + state.current.kind).style.width = '0%';
      state.current = null;
      updateButtons();
    }
  }

  document.getElementById('score').textContent = state.score;
  document.getElementById('strikes').textContent = state.strikes;

  state.timeLeft -= 1/60;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));
  if (state.timeLeft <= 0) endGame(true);
}

function endGame(timeUp) {
  state.running = false;
  if (!state.submitted) { state.submitted = true; const s = state.score; setTimeout(() => window.GC && GC.submitScore(s), 1200); }
  document.getElementById('msgTitle').textContent = timeUp === 'giveup' ? '🏳️ ここで終了' : timeUp ? '🔔 チャイムが鳴った' : '😱 見つかった…';
  document.getElementById('msgText').textContent =
    `スコア: ${state.score}点 (警告${state.strikes}回)` + (timeUp ? '' : '\n「あとで職員室に来なさい」');
  document.getElementById('msg').style.display = 'flex';
}

function draw() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  // 黒板
  ctx.fillStyle = '#2e4d3a';
  ctx.fillRect(40, 20, 280, 130);
  ctx.strokeStyle = '#8a6d3a';
  ctx.lineWidth = 8;
  ctx.strokeRect(40, 20, 280, 130);

  // 先生
  const t = state.teacher;
  ctx.font = '70px sans-serif';
  const face = t.mode === 'board' ? '🧑‍🏫' : (t.mode === 'telegraph' ? '🙂‍↕️' : '😠');
  ctx.save();
  if (t.mode === 'board') { ctx.translate(180, 170); ctx.scale(1, 1); }
  else { ctx.translate(180, 170); }
  ctx.fillText(face, -35, 20);
  ctx.restore();

  if (t.mode !== 'board') {
    ctx.fillStyle = t.mode === 'watch' ? 'rgba(217,83,79,0.12)' : 'rgba(240,173,78,0.12)';
    ctx.fillRect(0, 0, W, H);
  }

  // 生徒の机(プレイヤー)
  ctx.font = '60px sans-serif';
  let studentFace = '🧑‍🎓';
  if (state.current === null) studentFace = '🧑‍🎓';
  else if (state.current.kind === 'bento') studentFace = '😋';
  else if (state.current.kind === 'letter') studentFace = '😏';
  else studentFace = '🤭';
  ctx.fillText(studentFace, 600, 200);
  ctx.fillStyle = '#8a6d3a';
  ctx.fillRect(560, 210, 120, 18);

  ctx.font = '14px sans-serif';
  ctx.fillStyle = '#555';
  ctx.fillText(t.mode === 'board' ? '先生は黒板を向いている(安全)' : (t.mode === 'telegraph' ? 'もうすぐこっちを向きそう…' : '先生がこっちを見ている！'), 420, 270);
}

function loop() { update(); draw(); requestAnimationFrame(loop); }

resetGame();
loop();
window.gcGiveUp = () => { if (state.running) endGame('giveup'); };
</script>
</body>
</html>
