<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>自転車で新聞配達</title>
<style>
  body { margin:0; background:#2a3a1a; color:#f0f5e0; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:560px; max-width:100%; margin-bottom:8px; font-size:14px; gap:10px; flex-wrap:wrap; }
  #wrap { position:relative; }
  canvas { background:#6a6a6a; border:3px solid #2a3a1a; border-radius:10px; display:block; touch-action:none; }
  #ctl { display:grid; grid-template-columns:repeat(3,70px); grid-template-rows:repeat(2,50px); gap:8px; margin-top:12px; justify-content:center; }
  #ctl button { font-size:16px; border-radius:10px; border:none; background:#5a7a2a; color:#fff; cursor:pointer; user-select:none; }
  #ctl button:active { background:#7a9a4a; }
  #btnLeft { grid-column:1; grid-row:1/3; }
  #btnRight { grid-column:3; grid-row:1/3; }
  #btnThrow { grid-column:2; grid-row:1/3; background:#d8902a; font-size:14px; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:560px; font-size:13px; color:#d0dcc0; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🚲 自転車で新聞配達</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>連続命中: <span id="combo">0</span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="560" height="420"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="ctl">
    <button id="btnLeft">◀</button>
    <button id="btnThrow">📰 投げる</button>
    <button id="btnRight">▶</button>
  </div>
  <div id="help">
    左右(矢印キー←→)で車線を移動。ポストが左右どちらかに現れたら、<b>そちら側の端の車線にいる状態でスペースキーか「投げる」</b>でポストへ直接投げ込める。
    道の真ん中に出る障害物(駐車車両・くぼみ)に当たるとクラッシュしてゲームオーバー。
  </div>

<script>
const LANES = 5, CELL = 112, W = LANES * CELL, H = 420;
const BIKE_Y = 340, TOP_Y = 30, THROW_WINDOW = 36;
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = {
    lane: 2, score: 0, combo: 0, running: true, throwCooldown: 0,
    mailboxes: [], obstacles: [], mailTimer: 60, obsTimer: 90,
    flash: null, flashTimer: 0, speed: 2.4,
  };
  updateHud();
  render();
}

function updateHud() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('combo').textContent = state.combo;
}
function laneX(lane) { return lane * CELL + CELL / 2; }

function moveLane(d) { if (state.running) state.lane = Math.max(0, Math.min(LANES - 1, state.lane + d)); }

function throwPaper() {
  if (!state.running || state.throwCooldown > 0) return;
  state.throwCooldown = 16;
  const near = state.mailboxes.find(m => !m.done && Math.abs(m.y - BIKE_Y) < THROW_WINDOW);
  if (!near) { state.flash = '…空振り'; state.flashTimer = 16; state.combo = 0; updateHud(); return; }
  near.done = true;
  const correctLane = near.side === 'L' ? 0 : LANES - 1;
  if (state.lane === correctLane) {
    state.combo++;
    state.score += 15 + state.combo * 3;
    state.flash = '📬 命中！'; state.flashTimer = 18;
  } else {
    state.combo = 0;
    state.flash = '😣 ポストに届かなかった'; state.flashTimer = 18;
  }
  updateHud();
}

document.getElementById('btnLeft').onclick = () => moveLane(-1);
document.getElementById('btnRight').onclick = () => moveLane(1);
document.getElementById('btnThrow').onclick = throwPaper;
document.addEventListener('keydown', e => {
  if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  if (e.key === 'ArrowLeft') moveLane(-1);
  if (e.key === 'ArrowRight') moveLane(1);
  if (e.key === ' ') throwPaper();
});

function update() {
  if (!state.running) return;
  if (state.throwCooldown > 0) state.throwCooldown--;
  if (state.flashTimer > 0) state.flashTimer--; else state.flash = null;
  state.speed = Math.min(4.5, 2.4 + state.score * 0.002);

  state.mailTimer--;
  if (state.mailTimer <= 0) {
    state.mailboxes.push({ side: Math.random() < 0.5 ? 'L' : 'R', y: TOP_Y - 10, done: false });
    state.mailTimer = 70 + Math.random() * 50;
  }
  state.obsTimer--;
  if (state.obsTimer <= 0) {
    state.obstacles.push({ lane: Math.floor(Math.random() * LANES), y: TOP_Y - 10 });
    state.obsTimer = Math.max(50, 110 - state.score * 0.1) + Math.random() * 40;
  }

  state.mailboxes.forEach(m => { m.y += state.speed; });
  state.mailboxes = state.mailboxes.filter(m => m.y < H + 20);
  state.obstacles.forEach(o => { o.y += state.speed; });

  for (const o of state.obstacles) {
    if (o.lane === state.lane && Math.abs(o.y - BIKE_Y) < 24) return endGame();
  }
  state.obstacles = state.obstacles.filter(o => o.y < H + 20);

  render();
}

function endGame() {
  state.running = false;
  document.getElementById('msgTitle').textContent = '💥 クラッシュ！';
  document.getElementById('msgText').textContent = `スコア: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#3a6a2a'; ctx.fillRect(0, 0, 18, H); ctx.fillRect(W - 18, 0, 18, H);
  ctx.strokeStyle = 'rgba(255,255,255,0.4)'; ctx.setLineDash([16, 14]); ctx.lineWidth = 2;
  for (let i = 1; i < LANES; i++) { ctx.beginPath(); ctx.moveTo(i * CELL, 0); ctx.lineTo(i * CELL, H); ctx.stroke(); }
  ctx.setLineDash([]);

  ctx.font = '30px sans-serif';
  state.mailboxes.forEach(m => {
    const x = m.side === 'L' ? 8 : W - 32;
    ctx.fillText(m.done ? '📭' : '📫', x, m.y);
  });

  ctx.font = '28px sans-serif';
  state.obstacles.forEach(o => ctx.fillText('🚗', laneX(o.lane) - 16, o.y));

  ctx.font = '32px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🚲', laneX(state.lane), BIKE_Y);
  ctx.textAlign = 'left';

  if (state.flash) {
    ctx.font = 'bold 20px sans-serif'; ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.fillText(state.flash, W / 2, 30); ctx.textAlign = 'left';
  }
}

setInterval(update, 1000 / 30);
resetGame();
</script>
</body>
</html>
