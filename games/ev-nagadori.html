<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>電気自動車でどこまでも</title>
<style>
  body { margin:0; background:#1a2a2a; color:#eafaf5; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:700px; max-width:100%; margin-bottom:8px; font-size:14px; gap:10px; flex-wrap:wrap; align-items:center; }
  #battWrap { width:130px; height:14px; background:#0a2a2a; border-radius:7px; overflow:hidden; display:inline-block; vertical-align:middle; margin-left:6px; }
  #battBar { height:100%; width:100%; background:#4ae08a; }
  #wrap { position:relative; }
  canvas { background:linear-gradient(#aee0f0,#dff5e0); border:3px solid #2a5a4a; border-radius:10px; display:block; }
  #notice { height:22px; text-align:center; font-size:14px; font-weight:bold; color:#2a5a4a; margin-top:6px; }
  #accelBtn { margin-top:10px; font-size:18px; padding:16px 50px; border-radius:16px; border:none; background:#2a8a6a; color:#fff; cursor:pointer; font-weight:bold; user-select:none; touch-action:none; }
  #accelBtn:active { background:#3aaa8a; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.8); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:700px; font-size:13px; color:#cfe8dc; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🔋 電気自動車でどこまでも</h1>
  <div id="hud">
    <div>走行距離: <span id="dist">0</span>m</div>
    <div>バッテリー: <span id="battWrap"><span id="battBar"></span></span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="700" height="300"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="notice"></div>
  <button id="accelBtn">🔽 アクセル(長押し)</button>
  <div id="help">
    「アクセル」を長押しで加速、離すと惰性でゆっくり減速(スペースキーでも可)。
    加速するほどバッテリーを多く使う。<b>上り坂は消費が激しく、下り坂は惰性で少し回復する</b>。
    向かい風は消費を増やし、追い風は助けてくれる。坂や風は少し手前で予告が出るので、加速の計画に使おう。
    バッテリーが尽きるまでにできるだけ遠くへ。
  </div>

<script>
const W = 700, H = 300, GROUND_Y = 230;
const MAX_SPEED = 6, ACCEL = 0.12, FRICTION = 0.05, DIST_SCALE = 0.08;
const BASE_COEF = 0.006, SLOPE_COEF = 0.012, WIND_COEF = 0.005;
let state = {};
let accelerating = false;

function randomZone() {
  const slopeRoll = Math.random();
  const slope = slopeRoll < 0.3 ? 'up' : slopeRoll < 0.55 ? 'down' : 'flat';
  const windRoll = Math.random();
  const wind = windRoll < 0.28 ? 'head' : windRoll < 0.5 ? 'tail' : 'none';
  return { slope, wind, length: 220 + Math.random() * 260 };
}

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  const zone = randomZone();
  state = {
    speed: 0, battery: 100, distance: 0, running: true,
    zone, zoneRemaining: zone.length, nextZone: randomZone(),
    scroll: 0,
  };
  updateHud();
  render();
}

function updateHud() {
  document.getElementById('dist').textContent = Math.floor(state.distance);
  document.getElementById('battBar').style.width = Math.max(0, state.battery) + '%';
  document.getElementById('battBar').style.background = state.battery < 25 ? '#e0603a' : state.battery < 55 ? '#e0c030' : '#4ae08a';
}

function zoneLabel(z) {
  const parts = [];
  if (z.slope === 'up') parts.push('⛰️上り坂');
  if (z.slope === 'down') parts.push('🛝下り坂');
  if (z.wind === 'head') parts.push('🌬️向かい風');
  if (z.wind === 'tail') parts.push('🍃追い風');
  return parts.join(' + ');
}

const accelBtn = document.getElementById('accelBtn');
accelBtn.addEventListener('pointerdown', e => { e.preventDefault(); accelerating = true; });
accelBtn.addEventListener('pointerup', () => accelerating = false);
accelBtn.addEventListener('pointercancel', () => accelerating = false);
accelBtn.addEventListener('pointerleave', () => accelerating = false);
document.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); accelerating = true; } });
document.addEventListener('keyup', e => { if (e.key === ' ') accelerating = false; });

function update() {
  if (!state.running) return;

  if (accelerating) state.speed = Math.min(MAX_SPEED, state.speed + ACCEL);
  else state.speed = Math.max(0, state.speed - FRICTION);

  const slopeFactor = state.zone.slope === 'up' ? 1 : state.zone.slope === 'down' ? -0.6 : 0;
  const windFactor = state.zone.wind === 'head' ? 1 : state.zone.wind === 'tail' ? -0.5 : 0;
  const drain = state.speed * (BASE_COEF + slopeFactor * SLOPE_COEF + windFactor * WIND_COEF) * (accelerating ? 1.4 : 0.8);
  state.battery = Math.min(100, state.battery - drain);

  const advance = state.speed * DIST_SCALE;
  state.distance += advance;
  state.scroll += state.speed;
  state.zoneRemaining -= advance;
  if (state.zoneRemaining <= 0) {
    state.zone = state.nextZone;
    state.zoneRemaining = state.zone.length;
    state.nextZone = randomZone();
  }

  const noticeEl = document.getElementById('notice');
  if (state.zoneRemaining < 150 && (state.nextZone.slope !== 'flat' || state.nextZone.wind !== 'none')) {
    noticeEl.textContent = `まもなく(${Math.max(0, Math.round(state.zoneRemaining))}m先): ${zoneLabel(state.nextZone)}`;
  } else {
    noticeEl.textContent = '';
  }

  updateHud();
  if (state.battery <= 0) { state.battery = 0; updateHud(); return endGame(); }

  render();
}

function endGame() {
  state.running = false;
  document.getElementById('msgTitle').textContent = '🔌 電欠…';
  document.getElementById('msgText').textContent = `走行距離: ${Math.floor(state.distance)}m`;
  document.getElementById('msg').style.display = 'flex';
  setTimeout(() => window.GC && GC.submitScore(Math.floor(state.distance)), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = '#5a9a6a'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.setLineDash([18, 16]); ctx.lineWidth = 3;
  const off = state.scroll % 34;
  ctx.beginPath(); ctx.moveTo(-off, GROUND_Y - 10); ctx.lineTo(W, GROUND_Y - 10); ctx.stroke();
  ctx.setLineDash([]);

  // 坂・風の飾り(見た目だけの丘のシルエット)
  ctx.fillStyle = 'rgba(60,120,80,0.35)';
  for (let i = 0; i < 4; i++) {
    const bx = ((i * 220) - (state.scroll * 0.4) % 220 + 220) % (W + 220) - 110;
    ctx.beginPath();
    ctx.moveTo(bx - 90, GROUND_Y);
    ctx.quadraticCurveTo(bx, GROUND_Y - (state.zone.slope === 'up' ? 60 : state.zone.slope === 'down' ? 20 : 36), bx + 90, GROUND_Y);
    ctx.fill();
  }

  if (state.zone.wind !== 'none') {
    ctx.font = '20px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.8)';
    const arrow = state.zone.wind === 'head' ? '⟸' : '⟹';
    for (let i = 0; i < 4; i++) ctx.fillText(arrow, 60 + i * 160, 40);
  }

  ctx.font = '40px sans-serif';
  ctx.fillText('🚗', 110, GROUND_Y + 4);
  ctx.font = '16px sans-serif';
  ctx.fillText('⚡', 128, GROUND_Y - 28);
}

setInterval(update, 1000 / 30);
resetGame();
</script>
</body>
</html>
