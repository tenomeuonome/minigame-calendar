<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>書類判定ハンコ係</title>
<style>
  body {
    margin: 0;
    background: #e9e4d8;
    color: #3a332a;
    font-family: "Hiragino Sans", "Yu Gothic", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 16px;
  }
  h1 { font-size: 20px; margin: 8px 0; }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 800px;
    max-width: 100%;
    margin-bottom: 8px;
    font-size: 14px;
  }
  #wrap { position: relative; width: 800px; max-width: 100%; }
  #desk {
    background: #c9a876;
    border-radius: 14px;
    padding: 24px;
    display: flex;
    justify-content: center;
  }
  #paper {
    width: 320px;
    background: #fffdf5;
    border: 1px solid #ccc5ad;
    box-shadow: 0 6px 14px rgba(0,0,0,0.25);
    border-radius: 4px;
    padding: 20px 22px;
    position: relative;
  }
  #paper h3 { margin: 0 0 12px; font-size: 15px; border-bottom: 2px solid #3a332a; padding-bottom: 8px; }
  .field { display: flex; justify-content: space-between; font-size: 14px; margin: 8px 0; }
  .field .v { font-weight: bold; }
  .stampMark {
    position: absolute;
    top: 50%; left: 50%;
    width: 90px; height: 90px;
    border: 5px solid #c0392b;
    border-radius: 50%;
    color: #c0392b;
    display: none;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    transform: translate(-50%, -50%) rotate(-18deg);
    opacity: 0.85;
  }
  .patience-bar { width: 320px; height: 8px; background: #eee; border-radius: 4px; overflow: hidden; margin: 12px auto 0; }
  .patience-fill { height: 100%; background: #6cc070; transition: width 0.1s linear; }
  .patience-fill.warn { background: #e0a33a; }
  .patience-fill.danger { background: #d9534f; }
  #controls { display: flex; justify-content: center; gap: 20px; margin-top: 18px; }
  #controls button {
    font-size: 16px;
    padding: 12px 24px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: bold;
    color: #fff;
  }
  #stampBtn { background: #c0392b; }
  #rejectBtn { background: #556070; }
  #toast { text-align: center; font-size: 14px; font-weight: bold; height: 20px; margin-top: 10px; }
  #msg {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(0,0,0,0.75); border-radius: 14px; text-align: center; color: #fff;
  }
  #msg h2 { font-size: 26px; margin-bottom: 8px; }
  #msg button { padding: 8px 20px; font-size: 15px; border-radius: 6px; border: none; background: #8a6a3a; color: #fff; cursor: pointer; margin-top: 8px; }
  #help { max-width: 800px; font-size: 13px; color: #6b6150; margin-top: 14px; line-height: 1.7; text-align: center; }
</style>
</head>
<body>
  <h1>🖋️ 書類判定ハンコ係</h1>
  <div id="hud">
    <div>スコア: <span id="score">0</span></div>
    <div>残り時間: <span id="time">60</span>秒</div>
    <div>ミス: <span id="miss">0</span> / 5</div>
  </div>
  <div id="wrap">
    <div id="desk">
      <div id="paper">
        <h3>申請書</h3>
        <div class="field"><span>氏名</span><span class="v" id="f-name"></span></div>
        <div class="field"><span>日付</span><span class="v" id="f-date"></span></div>
        <div class="field"><span>印鑑欄</span><span class="v" id="f-seal"></span></div>
        <div class="field"><span>サイン</span><span class="v" id="f-sign"></span></div>
        <div class="stampMark" id="stampMark">受理</div>
      </div>
    </div>
    <div class="patience-bar"><div class="patience-fill" id="patienceFill"></div></div>
    <div id="controls">
      <button id="stampBtn" onclick="decide(true)">🔴 ハンコを押す</button>
      <button id="rejectBtn" onclick="decide(false)">✖️ 却下する</button>
    </div>
    <div id="toast"></div>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="help">
    書類の内容を見て、不備が無ければ<b>ハンコを押す</b>、不備があれば<b>却下する</b>。<br>
    不備の例: 日付が古い(期限切れ)・氏名が空欄・印鑑欄やサインが無い。1つでもあれば却下が正解。
  </div>

<script>
let state = {};

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = { score: 0, miss: 0, timeLeft: 60, patience: 1, doc: null, running: true, locked: false };
  nextDoc();
  render();
}

function randomDate(expired) {
  if (expired) {
    const y = 2018 + Math.floor(Math.random() * 5); // 2018〜2022年(期限切れ)
    return `${y}/${String(1 + Math.floor(Math.random()*12)).padStart(2,'0')}/${String(1+Math.floor(Math.random()*28)).padStart(2,'0')}`;
  }
  return `2026/${String(9 + Math.floor(Math.random()*2)).padStart(2,'0')}/${String(1+Math.floor(Math.random()*28)).padStart(2,'0')}`;
}

const NAMES = ['田中 一郎', '佐藤 花子', '鈴木 健', '山本 さくら', '伊藤 ゆい', '渡辺 大輔'];

function nextDoc() {
  const dateBad = Math.random() < 0.25;
  const nameBad = Math.random() < 0.15;
  const sealBad = Math.random() < 0.2;
  const signBad = Math.random() < 0.2;
  state.doc = {
    name: nameBad ? '' : NAMES[Math.floor(Math.random() * NAMES.length)],
    date: randomDate(dateBad),
    dateBad, nameBad, sealBad, signBad,
    seal: !sealBad, sign: !signBad,
  };
  state.doc.valid = !dateBad && !nameBad && !sealBad && !signBad;
  state.patience = 1;
  state.locked = false;
  document.getElementById('stampMark').style.display = 'none';
}

function toast(text, ok) {
  const el = document.getElementById('toast');
  el.textContent = text;
  el.style.color = ok ? '#2e7d32' : '#c0392b';
  setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 900);
}

function decide(stamp) {
  if (!state.running || state.locked) return;
  state.locked = true;
  const correct = stamp === state.doc.valid;
  if (stamp) {
    document.getElementById('stampMark').style.display = 'flex';
  }
  if (correct) {
    state.score += 10;
    toast(stamp ? '受理！正しい判断' : '却下、正しい判断', true);
  } else {
    state.miss++;
    toast(stamp ? '不備を見逃した…' : '問題ない書類を却下した…', false);
  }
  setTimeout(() => {
    if (state.miss >= 5) { endGame(false); return; }
    nextDoc();
    render();
  }, 500);
}

function update() {
  if (!state.running || state.locked) return;
  state.patience -= 1 / (420 + state.score * 1.5);
  if (state.patience <= 0) {
    state.miss++;
    toast('判断が遅れて次の書類が積まれた…', false);
    if (state.miss >= 5) { endGame(false); return; }
    nextDoc();
  }
  state.timeLeft -= 1/60;
  if (state.timeLeft <= 0) { endGame(true); return; }
  render();
}

function render() {
  document.getElementById('score').textContent = state.score;
  document.getElementById('miss').textContent = state.miss;
  document.getElementById('time').textContent = Math.max(0, Math.ceil(state.timeLeft));

  const d = state.doc;
  document.getElementById('f-name').textContent = d.name || '(空欄)';
  document.getElementById('f-date').textContent = d.date;
  document.getElementById('f-seal').textContent = d.seal ? 'あり' : 'なし';
  document.getElementById('f-sign').textContent = d.sign ? 'あり' : 'なし';

  const pct = Math.max(0, state.patience * 100);
  const fill = document.getElementById('patienceFill');
  fill.style.width = pct + '%';
  fill.className = 'patience-fill' + (pct < 25 ? ' danger' : pct < 55 ? ' warn' : '');
}

function endGame(timeUp) {
  state.running = false;
  if (!state.submitted) { state.submitted = true; const s = state.score; setTimeout(() => window.GC && GC.submitScore(s), 1200); }
  document.getElementById('msgTitle').textContent = timeUp ? '🔔 本日の受付終了' : '😣 ミスが多すぎた…';
  document.getElementById('msgText').textContent = `スコア: ${state.score}点 (ミス${state.miss}回)`;
  document.getElementById('msg').style.display = 'flex';
}

setInterval(update, 1000 / 60);
resetGame();
</script>
</body>
</html>
