<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>きびだんご百人力</title>
<style>
  body { margin:0; background:#2a1a3a; color:#f5ecff; font-family:"Hiragino Sans","Yu Gothic",sans-serif; display:flex; flex-direction:column; align-items:center; padding:16px; }
  h1 { font-size:20px; margin:8px 0; }
  #hud { display:flex; justify-content:space-between; width:480px; max-width:100%; margin-bottom:8px; font-size:14px; }
  #wrap { position:relative; }
  canvas { background:#4a2a5a; border:3px solid #1a0a2a; border-radius:10px; display:block; }
  #powerWrap { width:100%; max-width:480px; margin-top:10px; }
  #powerBar { height:24px; background:#2a1a3a; border-radius:12px; overflow:hidden; border:2px solid #d8a0ff; }
  #powerFill { height:100%; width:0%; background:linear-gradient(90deg,#8a5aff,#ff6ab0); transition:width .2s; }
  #powerLabel { text-align:center; font-size:14px; margin-top:4px; }
  #dango { display:flex; gap:12px; justify-content:center; margin-top:14px; }
  #dango button { font-size:16px; padding:16px 20px; border-radius:16px; border:3px solid #d8a0ff; background:#5a3a6a; color:#fff; cursor:pointer; font-weight:bold; min-width:80px; }
  #dango button:active { background:#7a5a8a; }
  #attackBtn { margin-top:14px; font-size:16px; padding:12px 30px; border-radius:14px; border:none; background:#e04a3a; color:#fff; cursor:pointer; font-weight:bold; }
  #attackBtn:disabled { opacity:.4; }
  #msg { position:absolute; top:0; left:0; width:100%; height:100%; display:none; align-items:center; justify-content:center; flex-direction:column; background:rgba(0,0,0,0.85); border-radius:10px; text-align:center; }
  #msg h2 { font-size:24px; margin-bottom:6px; }
  #msg p { color:#ddd; margin-bottom:14px; white-space:pre-line; }
  #msg button { padding:8px 20px; font-size:15px; border-radius:6px; border:none; background:#f0c020; color:#2a2a2a; cursor:pointer; font-weight:bold; }
  #help { max-width:480px; font-size:13px; color:#ddc8ee; margin-top:14px; line-height:1.7; text-align:center; }
</style>
</head>
<body>
  <h1>🍡 きびだんご百人力</h1>
  <div id="hud">
    <div>倒した鬼: <span id="oniCount">0</span>匹</div>
    <div>スコア: <span id="score">0</span></div>
  </div>
  <div id="wrap">
    <canvas id="game" width="480" height="200"></canvas>
    <div id="msg">
      <h2 id="msgTitle"></h2>
      <p id="msgText"></p>
      <button onclick="resetGame()">もう一度</button>
    </div>
  </div>
  <div id="powerWrap">
    <div id="powerBar"><div id="powerFill"></div></div>
    <div id="powerLabel">お供のパワー: <span id="power">0</span> / 100</div>
  </div>
  <div id="dango"></div>
  <button id="attackBtn">⚔️ 今のパワーで鬼に挑む</button>
  <div id="help">
    3つのきびだんごから1つ選んでお供に食べさせ、パワーを100に近づけよう。ぴったり100なら会心の一撃で大ボーナス。
    100を超えると鬼に飲み込まれて終了。危ないと思ったら「今のパワーで挑む」でそこまでのパワー分を得点にして次の鬼へ。
  </div>

<script>
let state = {};

function newDango() {
  return Array.from({ length: 3 }, () => 4 + Math.floor(Math.random() * 28));
}

function resetGame() {
  document.getElementById('msg').style.display = 'none';
  state = { running: true, power: 0, oniCount: 0, score: 0, dango: newDango(), flash: null };
  renderDango();
  updateHud();
  render();
}

function updateHud() {
  document.getElementById('oniCount').textContent = state.oniCount;
  document.getElementById('score').textContent = state.score;
  document.getElementById('power').textContent = state.power;
  document.getElementById('powerFill').style.width = Math.min(100, state.power) + '%';
  document.getElementById('attackBtn').disabled = state.power <= 0 || !state.running;
}

function renderDango() {
  const box = document.getElementById('dango');
  box.innerHTML = '';
  state.dango.forEach(v => {
    const b = document.createElement('button');
    b.textContent = `🍡+${v}`;
    b.onclick = () => eatDango(v);
    box.appendChild(b);
  });
}

function eatDango(v) {
  if (!state.running) return;
  state.power += v;
  if (state.power === 100) {
    state.score += 300;
    state.oniCount++;
    state.flash = '🌟 会心の一撃！鬼を倒した！';
    nextOni();
  } else if (state.power > 100) {
    return endGame();
  } else {
    state.dango = newDango();
    renderDango();
  }
  updateHud();
  render();
}

function nextOni() {
  state.power = 0;
  state.dango = newDango();
  renderDango();
}

document.getElementById('attackBtn').onclick = () => {
  if (!state.running || state.power <= 0) return;
  state.score += state.power;
  state.oniCount++;
  state.flash = `⚔️ パワー${state.power}で鬼を倒した！`;
  nextOni();
  updateHud();
  render();
};

function endGame() {
  state.running = false;
  document.getElementById('msgTitle').textContent = '😱 鬼に飲み込まれた…';
  document.getElementById('msgText').textContent = `倒した鬼: ${state.oniCount}匹\nスコア: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  updateHud();
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
}

function render() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  ctx.font = '60px sans-serif'; ctx.textAlign = 'center';
  ctx.fillText('🦹', W * 0.72, H * 0.65);
  ctx.font = '46px sans-serif';
  ctx.fillText('🐵', W * 0.28, H * 0.68);
  ctx.textAlign = 'left';

  if (state.flash) {
    ctx.font = 'bold 16px sans-serif'; ctx.fillStyle = '#fff';
    ctx.textAlign = 'center'; ctx.fillText(state.flash, W / 2, 24); ctx.textAlign = 'left';
  }
}

window.gcGiveUp = () => {
  if (!state.running) return;
  state.running = false;
  document.getElementById('msgTitle').textContent = '🏳️ ここで終了';
  document.getElementById('msgText').textContent = `倒した鬼: ${state.oniCount}匹\nスコア: ${state.score}`;
  document.getElementById('msg').style.display = 'flex';
  updateHud();
  setTimeout(() => window.GC && GC.submitScore(state.score), 1200);
};
resetGame();
</script>
</body>
</html>
